<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B1A">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="My Health Plan: pantau suplemen, air, tidur, jalan kaki dan puasa berselang anda. Healthy Me, Happier Me!">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Health Plan">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <title>My Health Plan</title>

  <!-- Tiny critical style: no white flash in dark mode, plus shell fallbacks. Placed BEFORE the real
       stylesheets so css/*.css always wins. -->
  <style>
    html { background: #FFF9F3; color: #151515; }
    body { margin: 0; background: inherit; color: inherit; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) { background: #141210; color: #F4F1EE; }
    }
    html[data-theme="dark"] { background: #141210; color: #F4F1EE; }
    #view:focus { outline: none; }
    .hud-xp { display: inline-block; width: 28px; height: 5px; border-radius: 99px; background: rgba(127, 127, 127, .35); overflow: hidden; vertical-align: middle; }
    .hud-xp-fill { display: block; height: 100%; width: 0; background: currentColor; border-radius: inherit; transition: width .4s ease; }
    @media (prefers-reduced-motion: reduce) { .hud-xp-fill { transition: none; } }
    #boot-error { display: none; position: fixed; z-index: 99999; top: 12px; left: 12px; right: 12px; max-width: 520px; margin: 0 auto; padding: 16px; border-radius: 16px; background: #FFE3D1; color: #151515; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; box-shadow: 0 8px 28px rgba(0, 0, 0, .25); }
    #boot-error.show { display: block; }
    #boot-error p { margin: 0 0 8px; }
    #boot-error button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #FF6B1A; color: #151515; font: inherit; font-weight: 700; cursor: pointer; }
  </style>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/today.css">
  <link rel="stylesheet" href="css/progress.css">
  <link rel="stylesheet" href="css/plan.css">
  <link rel="stylesheet" href="css/rewards.css">
  <link rel="stylesheet" href="css/settings.css">

  <script defer src="js/core.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/icons.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/scoring.js"></script>
  <script defer src="js/gamify.js"></script>
  <script defer src="js/insights.js"></script>
  <script defer src="js/charts.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/reminders.js"></script>
  <script defer src="js/pwa.js"></script>
  <script defer src="js/views/today.js"></script>
  <script defer src="js/views/progress.js"></script>
  <script defer src="js/views/plan.js"></script>
  <script defer src="js/views/rewards.js"></script>
  <script defer src="js/views/settings.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="boot-error" role="alert">
    <p lang="ms"><strong>Maaf, aplikasi tidak dapat dimulakan.</strong> Data anda selamat. Cuba muat semula.</p>
    <p lang="en">Sorry, the app could not start. Your data is safe. Please reload.</p>
    <button type="button" id="boot-reload">Muat semula / Reload</button>
  </div>

  <div class="app" id="app">
    <header class="app-header">
      <div class="app-brand">
        <svg class="app-brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 21.2l-1.4-1.27C5.4 15.24 2 12.16 2 8.4 2 5.5 4.24 3.3 7.1 3.3c1.62 0 3.17.76 4.15 1.95h1.5A5.6 5.6 0 0 1 16.9 3.3C19.76 3.3 22 5.5 22 8.4c0 3.76-3.4 6.84-8.6 11.54L12 21.2z"/></svg>
        <span class="app-brand-name">My Health Plan</span>
      </div>
      <div class="hud" id="hud">
        <button type="button" class="hud-chip" id="hud-streak">
          <span class="hud-ico" aria-hidden="true">🔥</span>
          <span class="hud-num num" id="hud-streak-num" aria-hidden="true">0</span>
        </button>
        <button type="button" class="hud-chip" id="hud-level">
          <span class="hud-ico" id="hud-level-emoji" aria-hidden="true">🌱</span>
          <span class="hud-num num" id="hud-level-num" aria-hidden="true">1</span>
          <span class="hud-xp" aria-hidden="true"><span class="hud-xp-fill" id="hud-xp-fill"></span></span>
        </button>
      </div>
    </header>

    <main id="view" class="app-main" tabindex="-1" aria-live="off">
      <noscript>
        <div class="page">
          <div class="card">
            <p lang="ms">Aplikasi ini memerlukan JavaScript. Sila aktifkannya dalam pelayar anda.</p>
            <p lang="en">This app needs JavaScript. Please turn it on in your browser.</p>
          </div>
        </div>
      </noscript>
    </main>

    <nav class="app-nav" id="nav" aria-label="Menu utama"></nav>
  </div>

  <script>
    /* Inline script-error fallback. Shows #boot-error if a script fails to load or the app never boots. */
    (function () {
      var el = document.getElementById('boot-error');
      var btn = document.getElementById('boot-reload');
      if (btn) btn.addEventListener('click', function () { location.reload(); });
      function show() { if (el) el.className = 'show'; }
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t.tagName === 'SCRIPT') show();
      }, true);
      window.addEventListener('load', function () {
        if (!(window.HP && window.HP.app && window.HP.app.booted)) show();
      });
    })();
  </script>
</body>
</html>
