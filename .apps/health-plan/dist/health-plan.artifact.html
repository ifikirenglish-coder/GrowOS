  });

  var DEFAULT_TIMES = { supplements: '08:00', water: '10:00', walk: '18:30', sleep: '22:00', fasting: '12:00' };

  /* ---------- helpers ---------- */
  function icon(name, size) { return HP.icons.svg(name, { size: size || 20 }); }

  function fk(el, key) { el.dataset.fk = key; return el; }

  function rerender() {
    if (HP.app && typeof HP.app.renderActive === 'function') HP.app.renderActive();
  }

  function todayStr() {
    if (HP.dates && HP.dates.today) return HP.dates.today();
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function dateLabel(str) {
    if (!str) return '';
    try { return HP.dates.label(str, { style: 'long' }) + ' ' + str.slice(0, 4); } catch (e) { return str; }
  }

  function toast(msg, type) {
    HP.ui.toast(msg, { type: type || 'info', icon: type === 'success' ? 'check-circle' : 'info' });
  }

  function errText(e) {
    var s = e && e.error;
    if (!s) return HP.t('settings.data.importFail');
    return HP.i18n.has && HP.i18n.has(s) ? HP.t(s) : String(s);
  }

  function section(iconName, titleText, children, extraClass) {
    return h('section', { class: 'card settings-card' + (extraClass ? ' ' + extraClass : '') },
      h('h2', { class: 'card-title settings-card-title' }, icon(iconName, 20), h('span', null, titleText)),
      children
    );
  }

  /** Row with text on the left and a control on the right. */
  function row(label, hint, control, key) {
    return h('div', { class: 'settings-row' },
      h('div', { class: 'settings-row-text' },
        h('div', { class: 'settings-row-label' }, label),
        hint ? h('div', { class: 'settings-hint' }, hint) : null
      ),
      h('div', { class: 'settings-row-control' }, control)
    );
  }

  function actionRow(iconName, label, hint, onClick, key, kind) {
    return h('div', { class: 'settings-action' },
      h('button', {
        type: 'button', class: 'btn ' + (kind || 'btn-ghost') + ' btn-block settings-action-btn',
        onclick: onClick, dataset: { fk: key }
      }, icon(iconName, 18), h('span', null, label)),
      hint ? h('p', { class: 'settings-hint' }, hint) : null
    );
  }

  /* ---------- 1. Profile ---------- */
  function profileCard() {
    var profile = HP.store.getProfile() || {};
    var greetText = function (name) {
      name = (name || '').trim();
      return name ? HP.t('settings.greeting', { name: name }) : HP.t('settings.greetingEmpty');
    };
    var preview = h('p', { class: 'settings-greeting', 'aria-live': 'polite' }, greetText(profile.name));
    var save = function (el) {
      var v = el.value.trim();
      if (v !== (HP.store.getProfile().name || '')) HP.store.setProfile({ name: v });
    };
    var input = h('input', {
      type: 'text', id: 'settings-name', class: 'input', value: profile.name || '',
      placeholder: HP.t('settings.name.placeholder'), maxlength: 40, autocomplete: 'given-name',
      autocapitalize: 'words', enterkeyhint: 'done', dataset: { fk: 'settings-name' },
      oninput: function (e) { preview.textContent = greetText(e.target.value); },
      onchange: function (e) { save(e.target); },
      onkeydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } }
    });
    return section('user', HP.t('settings.profile.title'), [
      h('div', { class: 'field' },
        h('label', { for: 'settings-name', class: 'settings-row-label' }, HP.t('settings.name.label')),
        input
      ),
      preview,
      profile.createdAt ? h('p', { class: 'settings-hint' }, HP.t('settings.memberSince') + ': ', h('strong', null, dateLabel(profile.createdAt))) : null
    ]);
  }

  /* ---------- 2. Appearance & language ---------- */
  function appearanceCard() {
    var s = HP.store.getSettings();
    var lang = fk(HP.ui.segmented({
      options: [{ value: 'bm', label: 'Bahasa Malaysia' }, { value: 'en', label: 'English' }],
      value: s.lang, label: HP.t('settings.lang.label'),
      onChange: function (v) { HP.store.setSettings({ lang: v }); }
    }), 'settings-lang');
    var theme = fk(HP.ui.segmented({
      options: [
        { value: 'auto', label: HP.t('settings.theme.auto') },
        { value: 'light', label: HP.t('settings.theme.light') },
        { value: 'dark', label: HP.t('settings.theme.dark') }
      ],
      value: s.theme, label: HP.t('settings.theme.label'),
      onChange: function (v) { HP.store.setSettings({ theme: v }); }
    }), 'settings-theme');
    var sound = fk(HP.ui.toggleSwitch({
      checked: !!s.sound, label: HP.t('settings.sound.label'),
      onChange: function (v) { HP.store.setSettings({ sound: !!v }); }
    }), 'settings-sound');
    var haptics = fk(HP.ui.toggleSwitch({
      checked: !!s.haptics, label: HP.t('settings.haptics.label'),
      onChange: function (v) { HP.store.setSettings({ haptics: !!v }); }
    }), 'settings-haptics');

    return section('globe', HP.t('settings.appearance.title'), [
      h('div', { class: 'settings-block' }, h('div', { class: 'settings-row-label' }, HP.t('settings.lang.label')), lang),
      h('div', { class: 'settings-block' }, h('div', { class: 'settings-row-label' }, HP.t('settings.theme.label')), theme),
      h('div', { class: 'divider' }),
      row(HP.t('settings.sound.label'), HP.t('settings.sound.hint'), sound),
      row(HP.t('settings.haptics.label'), HP.t('settings.haptics.hint'), haptics)
    ]);
  }

  /* ---------- 3. Reminders ---------- */
  function permission() {
    try { return HP.reminders && HP.reminders.permission ? HP.reminders.permission() : 'unsupported'; } catch (e) { return 'unsupported'; }
  }

  function permissionNode() {
    var p = permission();
    var tone = p === 'granted' ? 'ok' : (p === 'default' ? 'neutral' : 'warn');
    var ic = p === 'granted' ? 'check-circle' : (p === 'default' ? 'bell' : 'info');
    var nodes = [HP.ui.chip(HP.t('settings.reminders.perm.' + p), { tone: tone, icon: ic })];
    if (p === 'default' && HP.reminders && HP.reminders.request) {
      nodes.push(h('button', {
        type: 'button', class: 'btn btn-ghost btn-sm', dataset: { fk: 'settings-allow-notif' },
        onclick: function () {
          Promise.resolve(HP.reminders.request()).catch(function () {}).then(rerender);
        }
      }, HP.t('settings.reminders.allow')));
    }
    return h('div', { class: 'settings-perm row row-wrap', 'aria-live': 'polite' }, nodes);
  }

  function reminderRow(id, times) {
    var name = HP.config.name(id);
    var color = HP.config.habit(id).color;
    var val = times[id] || '';
    var on = !!val;
    var sw = fk(HP.ui.toggleSwitch({
      checked: on, label: HP.t('settings.reminders.switchFor', { habit: name }),
      onChange: function (v) {
        var t = {}; t[id] = v ? (DEFAULT_TIMES[id] || '09:00') : '';
        HP.store.setSettings({ reminders: { times: t } });
      }
    }), 'settings-rem-sw-' + id);
    var controls = [];
    if (on) {
      controls.push(h('input', {
        type: 'time', class: 'input settings-time', value: val, step: 60,
        'aria-label': HP.t('settings.reminders.timeFor', { habit: name }),
        dataset: { fk: 'settings-rem-time-' + id },
        onchange: function (e) {
          var t = {}; t[id] = e.target.value || '';
          HP.store.setSettings({ reminders: { times: t } });
        }
      }));
    }
    controls.push(sw);
    return h('div', { class: 'settings-rem-row' },
      h('span', { class: 'settings-habit-icon', style: { '--hc': color }, 'aria-hidden': 'true' }, icon(HP.config.habit(id).icon, 18)),
      h('span', { class: 'settings-rem-name' }, name),
      h('div', { class: 'settings-rem-controls' }, controls)
    );
  }

  function remindersCard() {
    var rem = HP.store.getSettings().reminders || { enabled: false, times: {} };
    var times = rem.times || {};
    var enabled = !!rem.enabled;
    var master = fk(HP.ui.toggleSwitch({
      checked: enabled, label: HP.t('settings.reminders.master'),
      onChange: function (v) {
        HP.store.setSettings({ reminders: { enabled: !!v } });
        if (v && HP.reminders && permission() === 'default' && HP.reminders.request) {
          Promise.resolve(HP.reminders.request()).catch(function () {}).then(rerender);
        }
      }
    }), 'settings-rem-master');

    var body = [row(HP.t('settings.reminders.master'), null, master)];
    if (enabled) {
      body.push(permissionNode());
      body.push(h('div', { class: 'settings-rem-list' }, HP.config.habitIds().map(function (id) { return reminderRow(id, times); })));
      body.push(h('p', { class: 'settings-hint' }, icon('calendar', 14), ' ', HP.t('settings.reminders.scheduledOnly')));
    } else {
      body.push(h('p', { class: 'settings-hint' }, HP.t('settings.reminders.offHint')));
    }
    body.push(h('div', { class: 'divider' }));
    body.push(h('p', { class: 'settings-explain' }, HP.t('settings.reminders.explain')));
    // The page viewer only allows a few file types (no .ics), so the calendar file is for the standalone app.
    if (!HP.isEmbedded() && HP.reminders && typeof HP.reminders.downloadICS === 'function') {
      body.push(h('button', {
        type: 'button', class: 'btn btn-ghost btn-block settings-action-btn', dataset: { fk: 'settings-ics' },
        onclick: function () {
          var any = Object.keys(HP.store.getSettings().reminders.times || {}).some(function (k) {
            return !!HP.store.getSettings().reminders.times[k];
          });
          if (!any) { toast(HP.t('settings.reminders.icsNone')); return; }
          try { HP.reminders.downloadICS(); toast(HP.t('settings.reminders.icsDone'), 'success'); }
          catch (e) { toast(HP.t('settings.reminders.icsFail')); }
        }
      }, icon('calendar', 18), h('span', null, HP.t('settings.reminders.ics'))));
    }
    return section('bell', HP.t('settings.reminders.title'), body);
  }

  /* ---------- 4. Install ---------- */
  function installCard() {
    var pwa = HP.pwa;
    if (!pwa) return null;
    var standalone = !!(pwa.isStandalone && pwa.isStandalone());
    var canInstall = !!(pwa.canInstall && pwa.canInstall());
    var ios = !!(pwa.isIOS && pwa.isIOS());
    var body = [];
    if (standalone) {
      body.push(HP.ui.chip(HP.t('settings.install.done'), { tone: 'ok', icon: 'check-circle' }));
    } else if (canInstall) {
      body.push(h('p', { class: 'settings-explain' }, HP.t('settings.install.body')));
      body.push(h('button', {
        type: 'button', class: 'btn btn-primary btn-block', dataset: { fk: 'settings-install' },
        onclick: function () {
          Promise.resolve(pwa.install()).catch(function () {}).then(rerender);
        }
      }, icon('download', 18), h('span', null, HP.t('settings.install.button'))));
    } else if (ios) {
      body.push(h('p', { class: 'settings-explain settings-install-steps' }, icon('share', 18), h('span', null, HP.t('settings.install.ios'))));
    } else {
      return null;
    }
    return section('download', HP.t('settings.install.title'), body);
  }

  /* ---------- 5. Your data ---------- */
  function exportBackup() {
    try {
      HP.saveFile('my-health-plan-backup-' + todayStr() + '.json', HP.store.exportJSON(), 'application/json').then(function (r) {
        if (r === 'saved') toast(HP.t('settings.data.exported'), 'success');
      }, function () { toast(HP.t('settings.data.exportFail')); });
    } catch (e) {
      toast(HP.t('settings.data.exportFail'));
    }
  }

  function readFile(file) {
    if (file.text) return file.text();
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result)); };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsText(file);
    });
  }

  function onImportFile(e) {
    var input = e.target;
    var file = input.files && input.files[0];
    if (!file) return;
    var done = function () { try { input.value = ''; } catch (x) { /* ignore */ } };
    if (file.size > 5 * 1024 * 1024) { toast(HP.t('settings.data.importFail')); done(); return; }
    readFile(file).then(function (text) {
      return HP.ui.confirm({
        title: HP.t('settings.data.importTitle'), message: HP.t('settings.data.importMsg'),
        confirmLabel: HP.t('settings.data.importConfirm'), cancelLabel: HP.t('common.cancel'), danger: true
      }).then(function (ok) {
        if (!ok) return;
        var r = HP.store.importJSON(text);
        if (r && r.ok) toast(HP.t('settings.data.imported'), 'success');
        else toast(errText(r));
      });
    }).catch(function () { toast(HP.t('settings.data.importFail')); }).then(done, done);
  }

  function loadSample() {
    HP.ui.confirm({
      title: HP.t('settings.data.sampleTitle'), message: HP.t('settings.data.sampleMsg'),
      confirmLabel: HP.t('settings.data.sampleConfirm'), cancelLabel: HP.t('common.cancel'), danger: true
    }).then(function (ok) {
      if (!ok) return;
      HP.store.seedDemo(28);
      toast(HP.t('settings.data.sampleDone'), 'success');
    });
  }

  function resetAll() {
    HP.ui.confirm({
      title: HP.t('settings.data.reset1Title'), message: HP.t('settings.data.reset1Msg'),
      confirmLabel: HP.t('settings.data.reset1Confirm'), cancelLabel: HP.t('common.cancel'), danger: true
    }).then(function (ok1) {
      if (!ok1) return null;
      return HP.ui.confirm({
        title: HP.t('settings.data.reset2Title'), message: HP.t('settings.data.reset2Msg'),
        confirmLabel: HP.t('settings.data.reset2Confirm'), cancelLabel: HP.t('common.cancel'), danger: true
      }).then(function (ok2) {
        if (!ok2) return;
        HP.store.reset();
        toast(HP.t('settings.data.resetDone'), 'success');
      });
    });
  }

  function dataCard() {
    var dates = HP.store.logDates() || [];
    var first = HP.store.firstLogDate();
    var fileInput = h('input', {
      type: 'file', accept: 'application/json,.json', class: 'settings-file', tabindex: '-1',
      'aria-hidden': 'true', onchange: onImportFile
    });
    var importBtn = actionRow('upload', HP.t('settings.data.import'), HP.t('settings.data.importHint'),
      function () { fileInput.click(); }, 'settings-import');

    return section('shield', HP.t('settings.data.title'), [
      h('p', { class: 'settings-privacy' }, icon('lock', 16), h('span', null, HP.t('settings.data.privacy'))),
      (HP.store.isPersistent && !HP.store.isPersistent()) ? h('p', { class: 'settings-privacy settings-nostorage', role: 'status' }, icon('info', 16), h('span', null, HP.t('settings.data.noStorage'))) : null,
      h('dl', { class: 'settings-kv' },
        h('div', null, h('dt', null, HP.t('settings.data.daysLogged')), h('dd', { class: 'num' }, String(dates.length))),
        h('div', null, h('dt', null, HP.t('settings.data.firstLog')), h('dd', null, first ? dateLabel(first) : HP.t('settings.data.none')))
      ),
      h('div', { class: 'divider' }),
      actionRow('download', HP.t('settings.data.export'), HP.t('settings.data.exportHint'), exportBackup, 'settings-export'),
      importBtn,
      fileInput,
      actionRow('sparkles', HP.t('settings.data.sample'), HP.t('settings.data.sampleHint'), loadSample, 'settings-sample'),
      h('div', { class: 'divider' }),
      h('div', { class: 'settings-danger' },
        actionRow('trash', HP.t('settings.data.reset'), HP.t('settings.data.resetHint'), resetAll, 'settings-reset', 'btn-danger')
      )
    ]);
  }

  /* ---------- 6. About ---------- */
  function aboutCard() {
    return section('info', HP.t('settings.about.title'), [
      h('div', { class: 'settings-about' },
        h('div', { class: 'settings-about-name' }, HP.t('app.name')),
        h('div', { class: 'settings-about-tagline' }, HP.t('app.tagline')),
        h('div', { class: 'settings-hint' }, HP.t('settings.about.version', { v: HP.config.VERSION }))
      ),
      h('p', { class: 'settings-hint' }, HP.t('settings.about.disclaimer'))
    ]);
  }

  /* ---------- view ---------- */
  HP.views.settings = {
    id: 'settings',
    icon: 'settings',
    titleKey: 'nav.settings',
    render: function (container) {
      var cards = [
        h('h1', { class: 'page-title' }, HP.t('nav.settings')),
        profileCard(),
        appearanceCard(),
        remindersCard(),
        installCard(),
        dataCard(),
        aboutCard()
      ];
      HP.mount(container, h('div', { class: 'page settings-page stack' }, cards));
    }
  };
})();

</script>
<script>
/* app.js — App shell: boot, routing, nav, HUD, theme/lang, change handling, welcome sheet. Loaded LAST. Owner: App Shell agent. */
(function () {
  'use strict';
  var HP = window.HP;

  var VIEW_IDS = ['today', 'progress', 'plan', 'rewards', 'settings'];
  var FALLBACK_ICON = { today: 'home', progress: 'chart-bar', plan: 'calendar', rewards: 'trophy', settings: 'settings' };
  var WELCOME_KEY = 'hp.welcomed';
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  /* ---------- strings ---------- */
  if (HP.i18n && HP.i18n.register) {
    HP.i18n.register({
      bm: {
        'shell.nav': 'Menu utama',
        'shell.streakLabel': 'Rentetan {n} {unit}. Buka ganjaran.',
        'shell.levelLabel': 'Tahap {n}, {name}, {xp} XP. Buka ganjaran.',
        'app.errorTitle': 'Maaf, skrin ini bermasalah',
        'app.errorBody': 'Data anda selamat. Cuba muat semula halaman.',
        'app.reload': 'Muat semula',
        'app.perfect': 'Hari sempurna! {xp} XP hari ini',
        'app.perfectPlain': 'Hari sempurna!',
        'app.badge': 'Lencana baharu: {name}',
        'app.levelUp': 'Naik tahap! Tahap {level}: {name}',
        'app.welcome.title': 'Selamat datang!',
        'app.welcome.body': 'Jejak lima tabiat kesihatan harian anda di satu tempat. Mudah, ringkas dan tanpa tekanan.',
        'app.welcome.name': 'Nama anda (pilihan)',
        'app.welcome.namePh': 'Contoh: Aisyah',
        'app.welcome.lang': 'Bahasa',
        'app.welcome.start': 'Mula'
      },
      en: {
        'shell.nav': 'Main menu',
        'shell.streakLabel': 'Streak: {n} {unit}. Open rewards.',
        'shell.levelLabel': 'Level {n}, {name}, {xp} XP. Open rewards.',
        'app.errorTitle': 'Sorry, this screen had a problem',
        'app.errorBody': 'Your data is safe. Try reloading the page.',
        'app.reload': 'Reload',
        'app.perfect': 'Perfect day! {xp} XP today',
        'app.perfectPlain': 'Perfect day!',
        'app.badge': 'New badge: {name}',
        'app.levelUp': 'Level up! Level {level}: {name}',
        'app.welcome.title': 'Welcome!',
        'app.welcome.body': 'Track your five daily health habits in one place. Simple, short and no pressure.',
        'app.welcome.name': 'Your name (optional)',
        'app.welcome.namePh': 'Example: Aisyah',
        'app.welcome.lang': 'Language',
        'app.welcome.start': 'Start'
      }
    });
  }

  /* ---------- state ---------- */
  var currentId = null;
  var selectedDate = null; // null = follow "today"
  var navItems = {};
  var hud = {};
  var perfectCache = {};
  var lastToday = null;
  var booted = false;

  /* ---------- small helpers ---------- */
  function today() {
    if (HP.dates && HP.dates.today) return HP.dates.today();
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function settings() {
    try { return (HP.store && HP.store.getSettings()) || {}; } catch (e) { return {}; }
  }
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* ignore */ }
  }
  function viewEl() { return document.getElementById('view'); }
  function jumpTo(y) {
    try { window.scrollTo({ top: y, left: 0, behavior: 'instant' }); } catch (e) { window.scrollTo(0, y); }
  }
  function safe(label, fn) {
    try { return fn(); } catch (e) { console.error('[HP.app] ' + label + ' failed', e); return undefined; }
  }
  function showFatal(err) {
    console.error('[HP.app] fatal', err);
    var el = document.getElementById('boot-error');
    if (el) el.className = 'show';
  }

  /* ---------- date ---------- */
  function getDate() { return selectedDate || today(); }
  function setDate(str) {
    if (!str || !DATE_RE.test(str)) selectedDate = null;
    else selectedDate = (str === today()) ? null : str;
    primePerfect(getDate());
  }

  /* ---------- theme ---------- */
  function applyTheme() {
    var theme = settings().theme;
    var root = document.documentElement;
    if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
    else root.removeAttribute('data-theme');
    var dark = theme === 'dark';
    if (theme !== 'light' && theme !== 'dark') {
      dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    var metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute('content', dark ? '#151515' : '#FF6B1A');
    var metaScheme = document.querySelector('meta[name="color-scheme"]');
    if (metaScheme) metaScheme.setAttribute('content', theme === 'light' ? 'light' : (theme === 'dark' ? 'dark' : 'light dark'));
  }

  function applyLang() {
    var lang = settings().lang === 'en' ? 'en' : 'bm';
    if (HP.setLang) HP.setLang(lang);
  }

  /* ---------- title / brand ---------- */
  function viewTitle(id) {
    var v = HP.views[id];
    return HP.t((v && v.titleKey) || ('nav.' + id));
  }
  function updateTitle() {
    document.title = (currentId ? viewTitle(currentId) + ' \u00B7 ' : '') + HP.t('app.name');
    var c = viewEl();
    if (c && currentId) c.setAttribute('aria-label', viewTitle(currentId));
  }
  function updateBrand() {
    var el = document.querySelector('.app-brand-name');
    if (el) el.textContent = HP.t('app.name');
  }

  /* ---------- nav ---------- */
  function iconNode(name, size, cls) {
    try {
      if (HP.icons && HP.icons.svg && name) {
        var s = HP.icons.svg(name, { size: size, class: cls || '' });
        if (s && s.setAttribute) { s.setAttribute('aria-hidden', 'true'); s.setAttribute('focusable', 'false'); }
        return s;
      }
    } catch (e) { console.error(e); }
    return null;
  }

  function buildNav() {
    var nav = document.getElementById('nav');
    if (!nav) {
      nav = HP.h('nav', { class: 'app-nav', id: 'nav' });
      var app = document.getElementById('app') || document.body;
      app.appendChild(nav);
    }
    nav.setAttribute('aria-label', HP.t('shell.nav'));
    navItems = {};
    var items = VIEW_IDS.map(function (id) {
      var v = HP.views[id];
      var label = HP.h('span', { class: 'nav-label' }, HP.t('nav.' + id));
      var a = HP.h('a', {
        class: 'nav-item', href: '#/' + id, dataset: { view: id },
        onclick: function (e) { onNavClick(e, id); }
      }, iconNode((v && v.icon) || FALLBACK_ICON[id], 24, 'nav-icon'), label);
      navItems[id] = { el: a, label: label };
      return a;
    });
    HP.mount(nav, items);
  }

  function updateNavLabels() {
    var nav = document.getElementById('nav');
    if (nav) nav.setAttribute('aria-label', HP.t('shell.nav'));
    VIEW_IDS.forEach(function (id) {
      if (navItems[id]) navItems[id].label.textContent = HP.t('nav.' + id);
    });
  }

  function updateNav() {
    VIEW_IDS.forEach(function (id) {
      var it = navItems[id];
      if (!it) return;
      if (id === currentId) it.el.setAttribute('aria-current', 'page');
      else it.el.removeAttribute('aria-current');
    });
  }

  function onNavClick(e, id) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
    e.preventDefault();
    if (id === 'today') setDate(null); // tapping the Today tab always means "today"
    if (id === currentId) {
      jumpTo(0);
      var c = viewEl();
      if (c) c.scrollTop = 0;
      if (id === 'today') renderActive();
      return;
    }
    navigate(id);
  }

  /* ---------- HUD ---------- */
  function buildHud() {
    hud.streakBtn = document.getElementById('hud-streak');
    hud.streakNum = document.getElementById('hud-streak-num');
    hud.levelBtn = document.getElementById('hud-level');
    hud.levelEmoji = document.getElementById('hud-level-emoji');
    hud.levelNum = document.getElementById('hud-level-num');
    hud.xpFill = document.getElementById('hud-xp-fill');
    var toRewards = function () { navigate('rewards'); };
    if (hud.streakBtn) hud.streakBtn.addEventListener('click', toRewards);
    if (hud.levelBtn) hud.levelBtn.addEventListener('click', toRewards);
  }

  function updateHud() {
    var g = null;
    try { g = HP.gamify && HP.gamify.compute(); } catch (e) { console.error('[HP.app] gamify.compute failed', e); }
    if (!g) return;
    var n = (g.streak && g.streak.current) || 0;
    if (hud.streakNum) hud.streakNum.textContent = String(n);
    if (hud.streakBtn) {
      var sl = HP.t('shell.streakLabel', { n: n, unit: HP.t(n === 1 ? 'common.day' : 'common.days') });
      hud.streakBtn.setAttribute('aria-label', sl);
      hud.streakBtn.setAttribute('title', sl);
    }
    if (hud.levelEmoji && g.levelEmoji) hud.levelEmoji.textContent = g.levelEmoji;
    if (hud.levelNum) hud.levelNum.textContent = String(g.level);
    if (hud.xpFill) hud.xpFill.style.width = Math.round(HP.clamp(g.levelPct || 0, 0, 1) * 100) + '%';
    if (hud.levelBtn) {
      var ll = HP.t('shell.levelLabel', { n: g.level, name: HP.tr(g.levelName), xp: g.xp });
      hud.levelBtn.setAttribute('aria-label', ll);
      hud.levelBtn.setAttribute('title', ll);
    }
  }

  /* ---------- rendering ---------- */
  function errorCard() {
    return HP.h('div', { class: 'page' },
      HP.h('div', { class: 'card stack', role: 'alert' },
        HP.h('h2', { class: 'h3' }, HP.t('app.errorTitle')),
        HP.h('p', { class: 'muted' }, HP.t('app.errorBody')),
        HP.h('div', { class: 'row' },
          HP.h('button', { class: 'btn btn-primary', type: 'button', onclick: function () { location.reload(); } }, HP.t('app.reload')))));
  }

  function renderActive(opts) {
    var container = viewEl();
    if (!container || !currentId) return;
    var fresh = !!(opts && opts.fresh);
    var fk = null, sel = null, winY = 0, boxY = 0;
    if (!fresh) {
      var ae = document.activeElement;
      if (ae && ae !== document.body && container.contains(ae) && ae.dataset && ae.dataset.fk) {
        fk = ae.dataset.fk;
        try { if (typeof ae.selectionStart === 'number') sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { /* ignore */ }
      }
      winY = window.scrollY || window.pageYOffset || 0;
      boxY = container.scrollTop || 0;
    }
    var view = HP.views[currentId];
    container.setAttribute('data-view', currentId);
    // Intro animations (rings, bars, lines) play on navigation only. Change-driven re-renders set data-rerender so charts.css keeps them still.
    if (fresh) container.removeAttribute('data-rerender'); else container.setAttribute('data-rerender', '');
    try {
      if (!view || typeof view.render !== 'function') throw new Error('View "' + currentId + '" is not registered');
      view.render(container);
    } catch (err) {
      console.error('[HP.app] view "' + currentId + '" failed to render', err);
      try { HP.mount(container, errorCard()); } catch (e2) { console.error(e2); }
    }
    if (fresh) {
      jumpTo(0);
      container.scrollTop = 0;
      try { container.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
      return;
    }
    jumpTo(winY);
    container.scrollTop = boxY;
    if (fk) {
      var el = container.querySelector('[data-fk="' + fk.replace(/(["\\])/g, '\\$1') + '"]');
      if (el && typeof el.focus === 'function') {
        try { el.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
        if (sel && typeof el.setSelectionRange === 'function') {
          try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ }
        }
      }
    }
  }
  var renderTimer = null;
  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(function runScheduled() {
      // A stepper +/- is being held: wait for release so its DOM is not replaced mid-press.
      if (HP.ui && HP.ui.isHolding && HP.ui.isHolding()) { renderTimer = setTimeout(runScheduled, 120); return; }
      renderTimer = null;
      renderActive();
    }, 30);
  }

  /* ---------- routing ---------- */
  function parseHash() {
    var m = /^#\/?([a-z]+)/.exec(window.location.hash || '');
    var id = m && m[1];
    return VIEW_IDS.indexOf(id) >= 0 ? id : 'today';
  }
  function syncHash(id, replace) {
    var want = '#/' + id;
    if (window.location.hash === want) return;
    try {
      if (replace) window.history.replaceState(null, '', want);
      else window.history.pushState(null, '', want);
    } catch (e) {
      window.location.hash = want;
    }
  }
  function onHashChange() {
    var id = parseHash();
    if (id !== currentId) navigate(id);
  }

  function navigate(id, opts) {
    opts = opts || {};
    if (VIEW_IDS.indexOf(id) < 0) id = 'today';
    if (opts.date) setDate(opts.date);
    var changed = id !== currentId;
    currentId = id;
    syncHash(id, opts.replace);
    updateNav();
    updateTitle();
    renderActive({ fresh: changed });
    HP.bus.emit('navigate', { view: id, params: opts });
  }

  /* ---------- perfect-day detection ---------- */
  function dayPerfect(date) {
    try { return !!HP.scoring.dayScore(date).perfect; } catch (e) { console.error('[HP.app] dayScore failed', e); return null; }
  }
  function primePerfect(date) {
    if (!HP.scoring || !date || perfectCache[date] !== undefined) return;
    var p = dayPerfect(date);
    if (p !== null) perfectCache[date] = p;
  }
  function primeAll() {
    if (!HP.scoring || !HP.dates) return;
    var t = today();
    primePerfect(t);
    primePerfect(getDate());
    for (var i = 1; i <= 14; i++) primePerfect(HP.dates.addDays(t, -i));
  }
  function detectPerfect(date) {
    if (!HP.scoring || !date) return;
    var after = dayPerfect(date);
    if (after === null) return;
    var before = perfectCache[date];
    perfectCache[date] = after;
    if (before === false && after && !(HP.dates && HP.dates.isFuture(date))) firePerfect(date);
  }
  function firePerfect(date) {
    HP.bus.emit('perfect', { date: date });
    var xp = 0;
    try { xp = (HP.gamify && HP.gamify.xpForDay(date)) || 0; } catch (e) { /* ignore */ }
    var msg = xp > 0 ? HP.t('app.perfect', { xp: xp }) : HP.t('app.perfectPlain');
    if (HP.ui) {
      safe('celebrate', function () { HP.ui.celebrate('perfect'); });
      safe('toast', function () { HP.ui.toast(msg, { type: 'success', emoji: '\uD83C\uDF1F' }); });
    }
  }

  /* ---------- bus handlers ---------- */
  function runCheckProgress() {
    if (HP.gamify && HP.gamify.checkProgress) safe('checkProgress', function () { HP.gamify.checkProgress(); });
  }

  function onChange(p) {
    var type = p && p.type;
    if (type === 'settings') {
      applyTheme();
      var lang = settings().lang;
      if (lang && lang !== HP.lang && HP.setLang) HP.setLang(lang); // emits 'lang'
    }
    if (type === 'log') {
      detectPerfect(p.date);
    } else if (type === 'init' || type === 'plan' || type === 'import' || type === 'reset') {
      perfectCache = {};
      primeAll();
    }
    if (type !== 'game' && type !== 'settings' && type !== 'profile') runCheckProgress();
    updateHud();
    scheduleRender();
  }

  function onLang() {
    updateNavLabels();
    updateBrand();
    updateHud();
    updateTitle();
    scheduleRender();
  }

  function onBadge(p) {
    var b = p && p.badge;
    if (!b || !HP.ui) return;
    safe('badge toast', function () {
      HP.ui.toast(HP.t('app.badge', { name: HP.tr(b.name) }), { type: 'badge', emoji: b.emoji });
      HP.ui.celebrate('badge');
    });
  }

  function onLevelUp(p) {
    if (!p || !HP.ui) return;
    safe('level toast', function () {
      var emoji = '';
      try { emoji = HP.gamify.compute().levelEmoji || ''; } catch (e) { /* ignore */ }
      HP.ui.toast(HP.t('app.levelUp', { level: p.level, name: HP.tr(p.name) }), { type: 'level', emoji: emoji || undefined });
      HP.ui.celebrate('level');
    });
  }

  function checkRollover() {
    if (document.visibilityState === 'hidden') return;
    var t = today();
    if (t === lastToday) return;
    lastToday = t;
    perfectCache = {};
    primeAll();
    updateHud();
    renderActive();
  }

  /* ---------- welcome sheet ---------- */
  function markWelcomed() { lsSet(WELCOME_KEY, '1'); }

  function maybeWelcome() {
    var name = '';
    try { name = (HP.store.getProfile() || {}).name || ''; } catch (e) { /* ignore */ }
    if (name || lsGet(WELCOME_KEY)) return;
    openWelcome({ name: '' });
  }

  function openWelcome(state) {
    if (!HP.ui || !HP.ui.sheet) return;
    var superseded = false;
    var handle = null;
    var input = HP.h('input', {
      class: 'input', id: 'welcome-name', type: 'text', maxlength: 40, autocomplete: 'given-name',
      enterkeyhint: 'done', placeholder: HP.t('app.welcome.namePh'), value: state.name || ''
    });
    var langCtl = HP.ui.segmented ? HP.ui.segmented({
      options: [{ value: 'bm', label: 'Bahasa Malaysia' }, { value: 'en', label: 'English' }],
      value: HP.lang,
      label: HP.t('app.welcome.lang'),
      onChange: function (v) {
        if (v === HP.lang) return;
        state.name = input.value;
        superseded = true;
        if (handle) handle.close();
        try { HP.store.setSettings({ lang: v }); } catch (e) { console.error(e); }
        setTimeout(function () { openWelcome(state); }, 340); // after the old sheet has left the DOM (300 ms), so ids never duplicate
      }
    }) : null;

    var content = HP.h('div', { class: 'stack' },
      HP.h('p', { class: 'muted' }, HP.t('app.welcome.body')),
      HP.h('div', { class: 'field' },
        HP.h('label', { for: 'welcome-name' }, HP.t('app.welcome.name')),
        input),
      langCtl ? HP.h('div', { class: 'field' },
        HP.h('span', { class: 'small muted' }, HP.t('app.welcome.lang')),
        langCtl) : null);

    handle = HP.ui.sheet({
      title: HP.t('app.welcome.title'),
      content: content,
      actions: [{
        label: HP.t('app.welcome.start'), kind: 'primary',
        onClick: function () {
          var name = String(input.value || '').trim().slice(0, 40);
          if (name) safe('setProfile', function () { HP.store.setProfile({ name: name }); });
          markWelcomed();
        }
      }],
      onClose: function () { if (!superseded) markWelcomed(); }
    });
  }

  /* ---------- boot ---------- */
  function boot() {
    try {
      if (!HP.store || !HP.views) throw new Error('Core modules missing');
      HP.store.init();
      applyLang();
      applyTheme();
      buildHud();
      buildNav();
      updateBrand();

      HP.bus.on('change', onChange);
      HP.bus.on('lang', onLang);
      HP.bus.on('badge', onBadge);
      HP.bus.on('levelup', onLevelUp);
      window.addEventListener('hashchange', onHashChange);
      window.addEventListener('popstate', onHashChange);
      document.addEventListener('visibilitychange', checkRollover);
      window.addEventListener('focus', checkRollover);
      if (window.matchMedia) {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var onMq = function () { if (!settings().theme || settings().theme === 'auto') applyTheme(); };
        if (mq.addEventListener) mq.addEventListener('change', onMq);
        else if (mq.addListener) mq.addListener(onMq);
      }

      if (HP.pwa && HP.pwa.register) safe('pwa.register', function () { HP.pwa.register(); });
      if (HP.reminders && HP.reminders.start) safe('reminders.start', function () { HP.reminders.start(); });

      lastToday = today();
      primeAll();
      runCheckProgress(); // silent when history already exists
      updateHud();
      navigate(parseHash(), { replace: true });
      booted = true;
      HP.app.booted = true;
      setTimeout(function () { safe('welcome', maybeWelcome); }, 400);
    } catch (err) {
      showFatal(err);
    }
  }

  /* ---------- public API ---------- */
  HP.app = {
    booted: false,
    navigate: navigate,
    getDate: getDate,
    setDate: setDate,
    renderActive: function () { renderActive(); },
    current: function () { return currentId; }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
    /* Inline script-error fallback. Shows #boot-error if a script fails to load or the app never boots. */
    (function () {
      var el = document.getElementById('boot-error');
      var btn = document.getElementById('boot-reload');
      if (btn) btn.addEventListener('click', function () { location.reload(); });
      function show() { if (el) el.className = 'show'; }
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t.tagName === 'SCRIPT') show();
      }, true);
      window.addEventListener('load', function () {
        if (!(window.HP && window.HP.app && window.HP.app.booted)) show();
      });
    })();
  </script>
