      all ? null : h('button', {
        class: 'btn btn-sm today-takeall', type: 'button', dataset: { fk: 'sup-all' },
        onclick: function () { tick(); HP.store.completeHabit(c.date, 'supplements'); }
      }, icon('check-circle', 18), t('today.sup.takeAll')));
  }

  function waterBody(c, hab, target) {
    var cfg = HP.config.habit('water'), val = hab.value;
    var adds = cfg.quick.map(function (q, i) {
      var ml = Math.round(q * 1000);
      return actionBtn(t('today.addMl', { ml: ml }), 'water-add-' + ml, function () { HP.store.addAmount(c.date, 'water', q); }, i === 0 ? 'btn-primary' : 'today-act-alt');
    });
    var q0 = cfg.quick[0];
    return h('div', { class: 'today-body stack-sm' },
      meterFor('water', hab.progress, amountText('water', val) + ' / ' + amountText('water', target)),
      h('div', { class: 'today-actions' },
        undoBtn('water-undo', t('today.removeMl', { ml: Math.round(q0 * 1000) }), val <= 0, function () { HP.store.addAmount(c.date, 'water', -q0); }),
        adds));
  }

  function sleepBody(c, hab, target) {
    var cfg = HP.config.habit('sleep'), val = hab.value;
    var chips = cfg.presets.map(function (p) {
      var on = val === p;
      return h('button', {
        class: 'today-pchip num' + (on ? ' is-on' : ''), type: 'button', 'aria-pressed': on ? 'true' : 'false', dataset: { fk: 'sleep-' + p },
        onclick: function () {
          tick();
          if (on) HP.store.clearHabit(c.date, 'sleep'); else HP.store.setValue(c.date, 'sleep', p);
        }
      }, amountText('sleep', p));
    });
    return h('div', { class: 'today-body stack-sm' },
      meterFor('sleep', hab.progress, amountText('sleep', val) + ' / ' + amountText('sleep', target)),
      h('div', { class: 'today-chips' }, chips),
      h('button', {
        class: 'btn btn-sm btn-ghost today-fine', type: 'button', dataset: { fk: 'sleep-fine' },
        onclick: function () { openValueSheet(c.date, 'sleep', val, target); }
      }, icon('edit', 16), t('today.sleep.fine')));
  }

  function walkBody(c, hab, target) {
    var cfg = HP.config.habit('walk'), val = hab.value;
    var adds = cfg.quick.map(function (m) {
      return actionBtn(t('today.walk.add', { n: m }), 'walk-add-' + m, function () { HP.store.addAmount(c.date, 'walk', m); }, 'today-act-alt');
    });
    return h('div', { class: 'today-body stack-sm' },
      meterFor('walk', hab.progress, amountText('walk', val) + ' / ' + amountText('walk', target)),
      h('div', { class: 'today-actions' },
        undoBtn('walk-undo', t('today.walk.remove', { n: 5 }), val <= 0, function () { HP.store.addAmount(c.date, 'walk', -5); }),
        adds),
      hab.done ? null : h('button', {
        class: 'btn btn-primary btn-block today-complete', type: 'button', dataset: { fk: 'walk-complete' },
        onclick: function () { tick(); HP.store.completeHabit(c.date, 'walk'); }
      }, icon('check-circle', 18), t('today.walk.complete', { n: target })));
  }

  function fastingBody(c, hab) {
    var on = !!hab.value;
    return h('div', { class: 'today-body' },
      h('button', {
        class: 'today-fast' + (on ? ' is-on' : ''), type: 'button', role: 'switch', 'aria-checked': on ? 'true' : 'false',
        dataset: { fk: 'fasting-toggle' },
        onclick: function () { tick(); HP.store.toggle(c.date, 'fasting'); }
      },
        h('span', { class: 'today-fast-label' }, t('today.fast.cta')),
        h('span', { class: 'today-switch', 'aria-hidden': 'true' }, h('span', { class: 'today-switch-thumb' }))));
  }

  function bodyFor(c, hab, target) {
    switch (hab.id) {
      case 'supplements': return supplementsBody(c, hab.value || []);
      case 'water': return waterBody(c, hab, target);
      case 'sleep': return sleepBody(c, hab, target);
      case 'walk': return walkBody(c, hab, target);
      case 'fasting': return fastingBody(c, hab);
      default: return null;
    }
  }

  /** Header status: plain text for multi/toggle, tappable value (opens sheet) for amounts. */
  function statusNode(c, hab, target) {
    var cfg = HP.config.habit(hab.id);
    if (cfg.kind === 'multi') {
      return h('div', { class: 'today-status num', 'aria-live': 'polite' }, t('today.sup.status', { n: (hab.value || []).length, total: cfg.items.length }));
    }
    if (cfg.kind === 'toggle') {
      return h('div', { class: 'today-status', 'aria-live': 'polite' }, t(hab.value ? 'today.fast.on' : 'today.fast.off'));
    }
    return h('button', {
      class: 'today-val num', type: 'button', dataset: { fk: hab.id + '-edit' },
      'aria-label': t('today.editValue', { habit: HP.config.name(hab.id) }) + ' (' + amountText(hab.id, hab.value) + ' / ' + amountText(hab.id, target) + ')',
      onclick: function () { openValueSheet(c.date, hab.id, hab.value, target); }
    }, num(hab.value) + ' / ' + amountText(hab.id, target), icon('edit', 14));
  }

  function tile(c, hab) {
    var id = hab.id, cfg = HP.config.habit(id), target = HP.store.getTarget(id);
    var pop = hab.done ? popStyle(c.date, id) : null;
    var style = { '--hc': cfg.color };
    if (pop) style['--pop-delay'] = pop['--pop-delay'];
    return h('article', {
      class: 'card today-tile' + (hab.done ? ' is-done' : '') + (pop ? ' today-pop' : ''),
      dataset: { habit: id }, style: style
    },
      h('div', { class: 'today-head' },
        iconCircle(id),
        h('div', { class: 'today-head-text' },
          h('h2', { class: 'today-name' }, HP.config.name(id)),
          statusNode(c, hab, target)),
        h('span', { class: 'today-check' + (hab.done ? ' is-on' : '') },
          hab.done ? [icon('check', 18), h('span', { class: 'sr-only' }, t('status.done'))] : null)),
      bodyFor(c, hab, target));
  }

  /* ---------- 4. rest section ---------- */
  function restItem(c, hab) {
    var id = hab.id, cfg = HP.config.habit(id), open = !!openRest[id], target = HP.store.getTarget(id);
    var xp = HP.config.XP.bonusOnRestDay;
    var hint = hab.done ? t('today.rest.logged') : t('today.rest.bonus', { xp: xp });
    var head = h('button', {
      class: 'today-rest-head', type: 'button', 'aria-expanded': open ? 'true' : 'false', dataset: { fk: 'rest-' + id },
      onclick: function () { openRest[id] = !openRest[id]; HP.app.renderActive(); }
    },
      iconCircle(id),
      h('span', { class: 'today-rest-text' },
        h('span', { class: 'today-name' }, HP.config.name(id)),
        h('span', { class: 'today-rest-hint small' }, hint)),
      hab.done ? h('span', { class: 'today-check is-on' }, icon('check', 16)) : null,
      h('span', { class: 'today-rest-chev', 'aria-hidden': 'true' }, icon(open ? 'chevron-up' : 'chevron-down', 18)));
    return h('div', {
      class: 'today-rest-item' + (open ? ' is-open' : '') + (hab.done ? ' is-done' : ''),
      dataset: { habit: id }, style: { '--hc': cfg.color }
    }, head, open ? bodyFor(c, hab, target) : null);
  }

  function restSection(c) {
    if (!c.rest.length) return null;
    return h('section', { class: 'today-rest', 'aria-labelledby': 'today-rest-title' },
      h('div', { class: 'today-section-head' },
        h('h2', { class: 'h3', id: 'today-rest-title' }, t('today.rest.title')),
        h('p', { class: 'small muted' }, t('today.rest.sub'))),
      h('div', { class: 'today-rest-list' }, c.rest.map(function (x) { return restItem(c, x); })));
  }

  /* ---------- 5. week strip ---------- */
  function weekState(d) {
    if (d.isFuture) return 'future';
    if (!d.logged && !d.isToday && d.date < HP.scoring.startDate()) return 'future'; // before tracking began: neutral, not a miss
    if (d.isRest) return 'rest';
    if (d.perfect) return 'done';
    if (d.isToday && !d.started) return 'future';
    return d.pct > 0 ? 'partial' : 'miss';
  }
  function weekCard(c) {
    var ws = HP.scoring.weekScore(c.date);
    var same = HP.dates.weekStart(c.date) === HP.dates.weekStart(HP.dates.today());
    var days = ws.days.map(function (d) {
      return {
        label: HP.config.dayName(d.dow, 'short'), state: weekState(d), today: d.isToday,
        onClick: d.isFuture ? undefined : function () { HP.app.setDate(d.date); HP.app.renderActive(); }
      };
    });
    return h('section', { class: 'card today-week' },
      h('div', { class: 'row row-between today-week-head' },
        h('h2', { class: 'card-title today-week-title' }, t(same ? 'today.week.this' : 'today.week.other')),
        ws.scheduledTotal > 0 ? h('span', { class: 'small muted num' }, t('today.week.summary', { done: ws.doneTotal, total: ws.scheduledTotal })) : null),
      HP.charts.weekStrip({ days: days, label: t(same ? 'today.week.this' : 'today.week.other') }));
  }

  /* ---------- 6. tip ---------- */
  function tipCard() {
    var ids = HP.config.habitIds();
    var id = ids[Math.abs(HP.dates.diffDays('2024-01-01', HP.dates.today())) % ids.length];
    var tip = safe(function () { return HP.insights.habitTip(id); }, '');
    if (!tip) return null;
    return h('aside', { class: 'today-tip', style: { '--hc': HP.config.habit(id).color } },
      iconCircle(id),
      h('div', { class: 'today-tip-text' },
        h('div', { class: 'today-tip-title small' }, t('today.tip.title', { habit: HP.config.name(id) })),
        h('p', { class: 'today-tip-body' }, tip)));
  }

  /* ---------- render ---------- */
  function render(container) {
    var today = HP.dates.today();
    var date = HP.app.getDate() || today;
    if (HP.dates.isFuture(date)) { date = today; HP.app.setDate(today); }
    if (restDate !== date) { openRest = {}; restDate = date; }

    var day = HP.scoring.dayScore(date);
    var byId = {};
    day.habits.forEach(function (x) { byId[x.id] = x; });
    var ordered = HP.config.habitIds().map(function (id) { return byId[id]; }).filter(Boolean);
    trackDone(date, ordered);

    var c = {
      date: date, day: day,
      sched: ordered.filter(function (x) { return x.scheduled; }),
      rest: ordered.filter(function (x) { return !x.scheduled; })
    };

    HP.mount(container, h('div', { class: 'page stack today' },
      dateBar(c),
      summaryCard(c),
      c.sched.length ? h('div', { class: 'today-tiles' }, c.sched.map(function (x) { return tile(c, x); })) : null,
      restSection(c),
      weekCard(c),
      tipCard()));
  }

  HP.views.today = { id: 'today', icon: 'home', titleKey: 'nav.today', render: render };
})();

</script>
<script>

      'progress.stat.streak': 'Current streak',
      'progress.stat.best': 'Best streak',
      'progress.trend.up': '▲ +{pct}%',
      'progress.trend.down': '▼ −{pct}%',

      'progress.trend.vs': 'vs the previous {n} days',
      'progress.noRangeData': 'No data for this period yet. Log something today to get started.',

      'progress.week.pct': 'commitment this week',

      'progress.trendCard.sub': 'Commitment percent for each day',
      'progress.trendCard.few': 'Log a few more days to see your trend.',
      'progress.trendCard.aria': 'Daily trend: latest {last}%, average {avg}%',
      'progress.trendCard.empty': 'No data yet',
      'progress.heat.title': '12-week calendar',
      'progress.heat.hint': 'Tap a day to see its details.',
      'progress.heat.less': 'Less',
      'progress.heat.more': 'More',
      'progress.heat.none': 'no data',
      'progress.nums.title': 'Habit numbers',
      'progress.nums.water': 'Avg water',
      'progress.nums.waterSub': 'per logged day',
      'progress.nums.sleep': 'Avg sleep',
      'progress.nums.sleepSub': 'per logged day',
      'progress.nums.walk': 'Total walking',
      'progress.nums.walkSub': 'in this period',
      'progress.nums.fasting': 'Fasting days',
      'progress.nums.fastingSub': 'of {n} scheduled',
      'progress.nums.supp': 'Supplements complete',
      'progress.nums.suppSub': 'of {n} scheduled days',
      'progress.empty.title': 'No data yet',
      'progress.empty.body': 'Log your first habit today and your progress will show up here.',
      'progress.empty.cta': 'Go to Today'
    }
  });

  /* ---------- module state ---------- */
  var range = 30; // 7 | 30 | 90, remembered across renders
  var RANGES = [7, 30, 90];

  /* ---------- helpers ---------- */
  function safe(fn, label) {
    try { return fn(); } catch (e) { console.error('[progress] ' + label + ' failed', e); return null; }
  }
  function isNum(n) { return typeof n === 'number' && isFinite(n); }

  /** Pick black-ish or white text for a given hex background (best contrast). */
  function readableOn(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
    if (!m) return '#151515';
    var n = parseInt(m[1], 16);
    var ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
      v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    var L = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
    var vsWhite = 1.05 / (L + 0.05);
    var vsInk = (L + 0.05) / (0.0075 + 0.05); // #151515 luminance ~ 0.0075
    return vsWhite >= vsInk ? '#fff' : '#151515';
  }

  function card(title, children, cls, sub) {
    return HP.h('section', { class: 'card progress-card ' + (cls || '') },
      title ? HP.h('h2', { class: 'card-title' }, title) : null,
      sub ? HP.h('p', { class: 'small muted progress-sub' }, sub) : null,
      children);
  }

  function goToday(date) {
    if (date && HP.app && HP.app.setDate) HP.app.setDate(date);
    if (HP.app && HP.app.navigate) HP.app.navigate('today', date ? { date: date } : undefined);
  }

  function rerender(container) {
    if (HP.app && HP.app.renderActive) HP.app.renderActive();
    else HP.views.progress.render(container);
  }

  function num(n, dp) { return HP.i18n.number(n, dp == null ? 0 : dp); }

  /* ---------- data ---------- */
  function trendDelta(cur, days, today) {
    if (!cur || !cur.scheduledTotal || !isNum(cur.pct)) return null;
    var prev = HP.scoring.commitment(days, HP.dates.addDays(today, -days));
    if (!prev || !prev.scheduledTotal || !prev.activeDays || !isNum(prev.pct)) return null;
    return Math.round(cur.pct - prev.pct);
  }

  /** Real numbers from raw logs over the range. Never invents: null when there is no data. */
  function habitNumbers(today, days) {
    var dates = HP.dates.range(HP.dates.addDays(today, -(days - 1)), today);
    var water = [], sleep = [], walk = [], supp = [];
    var walkTotal = 0, fastDays = 0, fastSched = 0, suppFull = 0, suppSched = 0;
    var targetSupp = HP.store.getTarget('supplements');
    dates.forEach(function (d) {
      var log = HP.store.getLog(d);
      if (log.water > 0) water.push(log.water);
      if (log.sleep > 0) sleep.push(log.sleep);
      if (log.walk > 0) { walk.push(log.walk); walkTotal += log.walk; }
      var sc = (log.supplements || []).length;
      if (sc > 0) supp.push(sc);
      if (HP.store.isScheduled('fasting', d)) fastSched++;
      if (HP.store.isScheduled('supplements', d)) suppSched++;
      if (log.fasting) fastDays++;
      if (HP.config.isDone('supplements', log.supplements, targetSupp)) suppFull++;
    });
    function avg(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
    return {
      water: { avg: avg(water), series: water },
      sleep: { avg: avg(sleep), series: sleep },
      walk: { total: walk.length ? walkTotal : null, series: walk },
      fasting: { days: fastDays, sched: fastSched, any: fastDays > 0 },
      supp: { days: suppFull, sched: suppSched, any: supp.length > 0, series: supp }
    };
  }

  /* ---------- sections ---------- */
  function buildRange(container) {
    var seg = HP.ui.segmented({
      label: HP.t('progress.rangeLabel'),
      value: range,
      options: RANGES.map(function (r) { return { value: r, label: HP.t('progress.range' + r) }; }),
      onChange: function (v) {
        var n = Number(v);
        if (RANGES.indexOf(n) < 0 || n === range) return;
        range = n;
        rerender(container);
      }
    });
    HP.$('button, [role="radio"]', seg).forEach(function (b, i) {
      if (!b.dataset.fk) b.dataset.fk = 'progress-range-' + i;
    });
    return HP.h('div', { class: 'progress-range' }, seg);
  }

  function statTile(icon, value, label) {
    return HP.h('div', { class: 'progress-stat' },
      HP.h('span', { class: 'progress-stat-ico', 'aria-hidden': 'true' }, HP.icons.svg(icon, { size: 18 })),
      HP.h('span', { class: 'progress-stat-num num' }, String(value)),
      HP.h('span', { class: 'progress-stat-label small muted' }, label));
  }

  function buildHero(cur, delta, streak) {
    var rating = cur.rating || HP.scoring.rate(cur.pct || 0);
    var hasData = !!cur.scheduledTotal;
    var pct = hasData ? Math.round(cur.pct) : null;

    var ring = HP.charts.ring({
      value: hasData ? HP.clamp(cur.pct / 100, 0, 1) : 0,
      size: 132, stroke: 13, color: rating.color,
      label: hasData ? pct + '%' : '-',
      sublabel: HP.t('progress.commitment')
    });

    var side = HP.h('div', { class: 'progress-hero-side' },
      HP.h('div', { class: 'progress-hero-range small muted' }, HP.t('progress.lastN', { n: range })),
      HasStars(rating, hasData),
      hasData ? HP.h('div', { class: 'progress-grade-row' },
        HP.h('span', {
          class: 'progress-grade',
          style: { background: rating.color, color: readableOn(rating.color) },
          role: 'img',
          'aria-label': HP.t('progress.gradeAria', { grade: rating.grade })
        }, rating.grade),
        HP.h('span', { class: 'progress-grade-label' }, HP.t('rating.' + rating.key))) : null,
      delta == null ? null : HP.h('div', { class: 'progress-trend-row' },
        HP.ui.chip(delta > 1 ? HP.t('progress.trend.up', { pct: delta })
          : (delta < -1 ? HP.t('progress.trend.down', { pct: Math.abs(delta) }) : HP.t('progress.trend.steady')),
          { tone: delta > 1 ? 'ok' : (delta < -1 ? 'warn' : 'neutral') }),
        HP.h('span', { class: 'small muted' }, HP.t('progress.trend.vs', { n: range }))));

    var stats = HP.h('div', { class: 'progress-stats' },
      statTile('star', cur.perfectDays || 0, HP.t('progress.stat.perfect')),
      statTile('calendar', cur.activeDays || 0, HP.t('progress.stat.active')),
      statTile('flame', streak ? streak.current : 0, HP.t('progress.stat.streak')),
      statTile('trophy', streak ? streak.best : 0, HP.t('progress.stat.best')));

    return card(HP.t('progress.hero.title'), [
      HP.h('div', { class: 'progress-hero-top' }, HP.h('div', { class: 'progress-ring' }, ring), side),
      hasData ? null : HP.h('p', { class: 'small muted progress-note', 'aria-live': 'polite' }, HP.t('progress.noRangeData')),
      stats
    ], 'progress-hero');
  }

  function HasStars(rating, hasData) {
    return hasData ? HP.h('div', { class: 'progress-stars' }, HP.charts.stars(rating.stars, { size: 20 })) : null;
  }

  function dayState(d) {
    if (d.isFuture) return 'future';
    if (!d.logged && !d.isToday && d.date < HP.scoring.startDate()) return 'future'; // before tracking began: neutral, not a miss
    if (d.isRest) return 'rest';
    if (d.perfect) return 'done';
    if (d.pct > 0) return 'partial';
    if (d.isToday && !d.started) return 'future';
    return 'miss';
  }

  function buildWeek(today) {
    var week = HP.scoring.weekScore(today);
    var review = HP.insights.weeklyReview(today) || {};
    var hasData = week.scheduledTotal > 0 && week.daysElapsed > 0;

    var strip = HP.charts.weekStrip({
      label: HP.t('common.week'),
      days: week.days.map(function (d) {
        var st = dayState(d);
        return {
          label: HP.config.dayName(d.dow, 'short'),
          state: st,
          today: !!d.isToday,
          onClick: d.isFuture ? undefined : function () { goToday(d.date); }
        };
      })
    });

    var highlights = (review.highlights || []).slice(0, 4);
    var focus = review.focus;

    return card(HP.t('progress.week.title'), [
      HP.h('div', { class: 'progress-week-top' },
        HP.h('div', { class: 'progress-week-strip' }, strip),
        HP.h('div', { class: 'progress-week-pct' },
          HP.h('span', { class: 'progress-week-num num' }, hasData ? Math.round(week.pct) + '%' : '-'),
          HP.h('span', { class: 'small muted' }, HP.t('progress.week.pct')))),
      hasData && review.headline
        ? HP.h('p', { class: 'progress-week-headline h3' }, review.headline)
        : HP.h('p', { class: 'small muted' }, review.headline || HP.t('progress.week.empty')),
      highlights.length ? HP.h('ul', { class: 'progress-bullets' },
        highlights.map(function (t) { return HP.h('li', null, t); })) : null,
      focus && focus.text ? HP.h('div', { class: 'progress-focus' },
        HP.h('div', { class: 'progress-focus-text' },
          HP.h('span', { class: 'progress-focus-label small muted' }, HP.t('progress.week.focus')),
          HP.h('span', null, focus.text)),
        HP.h('button', {
          type: 'button', class: 'btn btn-primary btn-sm', 'data-fk': 'progress-focus-go',
          onclick: function () { goToday(); }
        }, HP.t('progress.week.go'))) : null
    ], 'progress-week');
  }

  function buildHabits(cur) {
    var rows = [];
    HP.config.habitIds().forEach(function (id) {
      var s = cur.habits && cur.habits[id];
      if (!s || !s.scheduled) return;
      var pct = isNum(s.pct) ? s.pct : Math.round((s.done / s.scheduled) * 100);
      rows.push({ id: id, done: s.done, scheduled: s.scheduled, pct: HP.clamp(Math.round(pct), 0, 100) });
    });
    if (!rows.length) return null;

    var best = null;
    if (rows.length > 1) {
      rows.forEach(function (r) { if (r.pct > 0 && (!best || r.pct > best.pct)) best = r; });
    }
    rows.sort(function (a, b) { return a.pct - b.pct; }); // weakest first (stable for ties)

    var list = HP.h('ul', { class: 'progress-habit-list' }, rows.map(function (r) {
      var h = HP.config.habit(r.id);
      return HP.h('li', { class: 'progress-habit' + (best === r ? ' is-best' : ''), style: { '--hc': h.color } },
        HP.h('span', { class: 'progress-habit-ico', 'aria-hidden': 'true' }, HP.icons.svg(h.icon, { size: 20 })),
        HP.h('div', { class: 'progress-habit-main' },
          HP.h('div', { class: 'progress-habit-head' },
            HP.h('span', { class: 'progress-habit-name' }, HP.config.name(r.id)),
            best === r ? HP.h('span', { class: 'progress-best-tag' },
              HP.icons.svg('sparkles', { size: 12 }), HP.t('progress.habits.best')) : null),
          HP.charts.meter({ value: r.pct / 100, color: h.color, height: 8, label: HP.config.name(r.id) + ' ' + r.pct + '%' }),
          HP.h('div', { class: 'progress-habit-foot small muted' },
            HP.t('progress.habits.days', { done: r.done, total: r.scheduled }))),
        HP.h('span', { class: 'progress-habit-pct num' }, r.pct + '%'));
    }));

    return card(HP.t('progress.habits.title'), [
      list,
      rows.length > 1 ? HP.h('p', { class: 'small muted progress-hint' }, HP.t('progress.habits.hint')) : null
    ], 'progress-habits');
  }

  function buildTrend(cur, today) {
    var pts = (cur.trend || []).filter(function (p) {
      if (!p || p.isRest || p.isFuture || !isNum(p.pct)) return false;
      if (p.date === today && !HP.store.hasLog(today)) return false; // morning must not look like a dip
      return true;
    });
    var body;
    var trendAria = pts.length ? HP.t('progress.trendCard.aria', {
      last: Math.round(pts[pts.length - 1].pct),
      avg: Math.round(pts.reduce(function (a, p) { return a + p.pct; }, 0) / pts.length)
    }) : HP.t('progress.trendCard.empty');
    if (pts.length < 2) {
      body = HP.h('p', { class: 'small muted progress-note' }, HP.t('progress.trendCard.few'));
    } else if (range === 7) {
      body = HP.charts.bars({
        data: pts.map(function (p) {
          return {
            label: HP.config.dayName(HP.dates.dow(p.date), 'short'),
            value: Math.round(p.pct),
            highlight: p.date === today
          };
        }),
        max: 100, height: 140, showValues: true, ariaLabel: trendAria
      });
    } else {
      body = HP.charts.line({
        points: pts.map(function (p) { return { label: HP.dates.label(p.date, { style: 'short' }), value: Math.round(p.pct) }; }),
        min: 0, max: 100, height: 140, area: true, showDots: pts.length <= 14,
        ariaLabel: trendAria, emptyLabel: HP.t('progress.trendCard.empty')
      });
    }
    return card(HP.t('progress.trendCard.title'), HP.h('div', { class: 'progress-chart' }, body),
      'progress-trend', HP.t('progress.trendCard.sub'));
  }

  function buildHeatmap(today) {
    var start = HP.dates.weekStart(HP.dates.addDays(today, -77)); // 12 full weeks incl. current
    var end = HP.dates.addDays(start, 83);
    var first = HP.store.firstLogDate();
    var days = HP.dates.range(start, end).map(function (d) {
      if (HP.dates.isFuture(d)) return { date: d, value: null, state: 'future' };
      if (first && d < first) return { date: d, value: null }; // before tracking began: neutral, not a miss
      var ds = HP.scoring.dayScore(d);
      if (ds.isRest) return { date: d, value: null, state: 'rest' };
      if (ds.isToday && !ds.started) return { date: d, value: null };
      return { date: d, value: HP.clamp(ds.pct / 100, 0, 1) };
    });
    var heat = HP.charts.heatmap({
      days: days, label: HP.t('progress.heat.title'), labels: { none: HP.t('progress.heat.none') },
      cell: 20, gap: 4, weekStartsMonday: true,
      onSelect: function (date) { goToday(date); }
    });
    var legend = HP.h('div', { class: 'progress-legend small muted', 'aria-hidden': 'true' },
      HP.h('span', null, HP.t('progress.heat.less')),
      [0, 1, 2, 3, 4].map(function (l) { return HP.h('i', { class: 'progress-legend-sw', 'data-level': String(l) }); }),
      HP.h('span', null, HP.t('progress.heat.more')));
    return card(HP.t('progress.heat.title'), [
      HP.h('div', { class: 'progress-heat' }, heat),
      HP.h('div', { class: 'progress-heat-foot' },
        HP.h('span', { class: 'small muted' }, HP.t('progress.heat.hint')), legend)
    ], 'progress-heatcard');
  }

  function numTile(habitId, label, valueText, sub, series) {
    var h = HP.config.habit(habitId);
    var has = valueText != null;
    return HP.h('div', { class: 'progress-num', style: { '--hc': h.color } },
      HP.h('div', { class: 'progress-num-head' },
        HP.h('span', { class: 'progress-num-ico', 'aria-hidden': 'true' }, HP.icons.svg(h.icon, { size: 16 })),
        HP.h('span', { class: 'small muted' }, label)),
      HP.h('div', { class: 'progress-num-value num' }, has ? valueText : '-'),
      HP.h('div', { class: 'progress-num-foot' },
        HP.h('span', { class: 'small muted' }, has ? sub : ''),
        has && series && series.length >= 3
          ? HP.h('span', { class: 'progress-spark', 'aria-hidden': 'true' },
            HP.charts.sparkline(series.slice(-30), { width: 64, height: 22, color: h.color }))
          : null));
  }

  function buildNumbers(today) {
    var n = habitNumbers(today, range);
    var unitL = HP.config.unitLabel('water');
    var unitH = HP.config.unitLabel('sleep');
    var unitM = HP.config.unitLabel('walk');
    var tiles = [
      numTile('water', HP.t('progress.nums.water'),
        n.water.avg == null ? null : num(n.water.avg, 1) + ' ' + unitL, HP.t('progress.nums.waterSub'), n.water.series),
      numTile('sleep', HP.t('progress.nums.sleep'),
        n.sleep.avg == null ? null : num(n.sleep.avg, 1) + ' ' + unitH, HP.t('progress.nums.sleepSub'), n.sleep.series),
      numTile('walk', HP.t('progress.nums.walk'),
        n.walk.total == null ? null : num(n.walk.total, 0) + ' ' + unitM, HP.t('progress.nums.walkSub'), n.walk.series),
      numTile('fasting', HP.t('progress.nums.fasting'),
        n.fasting.any ? String(n.fasting.days) : null, HP.t('progress.nums.fastingSub', { n: n.fasting.sched }), null),
      numTile('supplements', HP.t('progress.nums.supp'),
        n.supp.any ? String(n.supp.days) : null, HP.t('progress.nums.suppSub', { n: n.supp.sched }), n.supp.series)
    ];
    return card(HP.t('progress.nums.title'), HP.h('div', { class: 'progress-nums' }, tiles),
      'progress-numscard', HP.t('progress.lastN', { n: range }));
  }

  /* ---------- view ---------- */
  function build(container) {
    var today = HP.dates.today();
    var title = HP.h('h1', { class: 'page-title' }, HP.t('nav.progress'));

    if (!HP.store.logDates().length) {
      return HP.h('div', { class: 'page progress' }, title,
        HP.ui.emptyState({
          icon: 'chart-bar',
          title: HP.t('progress.empty.title'),
          body: HP.t('progress.empty.body'),
          action: { label: HP.t('progress.empty.cta'), onClick: function () { goToday(); } }
        }));
    }

    var cur = safe(function () { return HP.scoring.commitment(range, today); }, 'commitment');
    var delta = cur ? safe(function () { return trendDelta(cur, range, today); }, 'trendDelta') : null;
    var streak = safe(function () { return HP.gamify.compute().streak; }, 'streak');

    var sections = [
      buildRange(container),
      cur ? safe(function () { return buildHero(cur, delta, streak); }, 'hero') : null,
      safe(function () { return buildWeek(today); }, 'week'),
      cur ? safe(function () { return buildHabits(cur); }, 'habits') : null,
      cur ? safe(function () { return buildTrend(cur, today); }, 'trend') : null,
      safe(function () { return buildHeatmap(today); }, 'heatmap'),
      safe(function () { return buildNumbers(today); }, 'numbers')
    ];
    return HP.h('div', { class: 'page progress' }, title, HP.h('div', { class: 'stack' }, sections));
  }

  HP.views.progress = {
    id: 'progress',
    icon: 'chart-bar',
    titleKey: 'nav.progress',
    render: function (container) {
      HP.mount(container, build(container));
    }
  };
})();

</script>

    },
    en: {

      'plan.weekNav': 'Choose week',
      'plan.weekDone': '{done} / {total} done',
      'plan.edit': 'Edit plan',
      'plan.editing': 'Done',
      'plan.editHint': 'Tap a cell to turn that day on or off for each habit.',
      'plan.editNote': 'Changes apply to all weeks.',
      'plan.reset': 'Reset to default plan',
      'plan.resetTitle': 'Reset your plan?',
      'plan.resetMsg': 'Days and targets go back to the default plan. Your logs are kept.',
      'plan.resetConfirm': 'Reset',
      'plan.resetToast': 'Default plan restored.',
      'plan.zeroDays': 'No days selected for {habit}. Pick at least one day.',
      'plan.targetOf': '{habit} target',
      'plan.target': 'Target',
      'plan.scheduled': 'Scheduled',
      'plan.on': 'On',
      'plan.cellOpen': 'Open {day} in Today',
      'plan.gridLabel': 'Weekly health habit grid',
      'plan.legend': 'Legend',
      'plan.summary': 'Weekly Goals',
      'plan.summaryNote': 'Progress this week',
      'plan.goalNone': 'No days selected',
      'plan.t.daily': 'Every day',
      'plan.t.timesWeek': '{n}× a week',
      'plan.t.except': '(except {days})',
      'plan.t.water': '≥ {v} L a day',
      'plan.t.waterSome': '≥ {v} L, {n}× a week',
      'plan.t.sleep': '{v}-9 hours a day',
      'plan.t.sleepSome': '{v}-9 hours, {n}× a week',
      'plan.t.sleepMax': '9 hours a day',
      'plan.t.walk': '{v} min × {n} days (a week)',
      'plan.t.none': 'No days selected',
      'plan.g.water': '≥ {v} L / day',
      'plan.g.sleep': '{v}-9 hours / day',
      'plan.g.sleepMax': '9 hours / day',
      'plan.g.walk': '{v} min × {n} days (= {total} min / week)',
      'plan.u.days': 'days',
      'plan.u.min': 'min',
      'plan.u.l': 'L',
      'plan.u.h': 'h',
      'plan.u.times': 'times',
      'plan.u.nights': 'nights',
      'plan.u.items': 'items',
      'plan.goal1': 'Healthier body',
      'plan.goal2': 'Steadier energy',
      'plan.goal3': 'Better focus',
      'plan.goal4': 'Higher productivity',
      'plan.goalsLabel': 'Your goals'
    }
  });

  /* ---------- module state ---------- */
  var viewWeek = null;      // Monday string of the week being viewed (null = current week)
  var editMode = false;
  var lastContainer = null; // only used to re-render after local UI actions

  /* ---------- helpers ---------- */
  function t(k, p) { return HP.t(k, p); }
  function el() { return HP.h.apply(null, arguments); }
  function icon(name, size, cls) { return HP.icons.svg(name, { size: size || 24, stroke: 2, class: cls || '' }); }

  function num(v) {
    var dp = Number.isInteger(v) ? 0 : (Number.isInteger(v * 10) ? 1 : 2);
    if (HP.i18n && HP.i18n.number) return HP.i18n.number(v, dp);
    return String(HP.round(v, dp));
  }

  function currentWeek() { return HP.dates.weekStart(HP.dates.today()); }
  function activeWeek() {
    var cur = currentWeek();
    if (!viewWeek || viewWeek > cur) viewWeek = cur;
    return viewWeek;
  }

  function rerender() {
    if (HP.app && HP.app.renderActive) HP.app.renderActive();
    else if (lastContainer) HP.views.plan.render(lastContainer);
  }

  function weekLabel(weekStart) {
    var dates = HP.dates.weekDates(weekStart);
    var a = HP.dates.parse(dates[0]);
    var b = HP.dates.parse(dates[6]);
    var sameMonth = a.getMonth() === b.getMonth();
    var left = HP.config.dayName(0, 'short') + ' ' + a.getDate() + (sameMonth ? '' : ' ' + HP.config.monthName(a.getMonth(), 'short'));
    var right = HP.config.dayName(6, 'short') + ' ' + b.getDate() + ' ' + HP.config.monthName(b.getMonth(), 'short');
    var yearNow = HP.dates.parse(HP.dates.today()).getFullYear();
    if (b.getFullYear() !== yearNow) right += ' ' + b.getFullYear();
    return left + ' - ' + right;
  }

  /* Days the habit is NOT scheduled, as "Sabtu" or "Sabtu, Ahad" (only when 1-2 days are missing). */
  function exceptText(days) {
    var missing = [];
    for (var i = 0; i < 7; i++) if (days.indexOf(i) < 0) missing.push(i);
    if (!days.length || missing.length < 1 || missing.length > 2) return '';
    return t('plan.t.except', { days: missing.map(function (i) { return HP.config.dayName(i, 'full'); }).join(', ') });
  }

  function freqText(days) {
    if (days.length >= 7) return t('plan.t.daily');
    var s = t('plan.t.timesWeek', { n: days.length });
    var ex = exceptText(days);
    return ex ? s + ' ' + ex : s;
  }

  /** Target text under the habit name. Built from the live plan so edits stay accurate. */
  function targetText(id) {
    var days = HP.store.getScheduledDays(id);
    var target = HP.store.getTarget(id);
    var n = days.length;
    if (!n) return t('plan.t.none');
    if (id === 'water') return n >= 7 ? t('plan.t.water', { v: num(target) }) : t('plan.t.waterSome', { v: num(target), n: n });
    if (id === 'sleep') {
      if (target >= 9) return t('plan.t.sleepMax');
      return n >= 7 ? t('plan.t.sleep', { v: num(target) }) : t('plan.t.sleepSome', { v: num(target), n: n });
    }
    if (id === 'walk') return t('plan.t.walk', { v: num(target), n: n });
    return freqText(days);
  }

  /** Shorter goal text for the weekly summary tiles. */
  function goalText(id) {
    var days = HP.store.getScheduledDays(id);
    var target = HP.store.getTarget(id);
    var n = days.length;
    if (!n) return t('plan.goalNone');
    if (id === 'water') {
      var w = t('plan.g.water', { v: num(target) });
      return n >= 7 ? w : w + ', ' + t('plan.t.timesWeek', { n: n });
    }
    if (id === 'sleep') {
      var s = target >= 9 ? t('plan.g.sleepMax') : t('plan.g.sleep', { v: num(target) });
      return n >= 7 ? s : s + ', ' + t('plan.t.timesWeek', { n: n });
    }
    if (id === 'walk') return t('plan.g.walk', { v: num(target), n: n, total: num(target * n) });
    return freqText(days);
  }

  function itemsText(id) {
    var h = HP.config.habit(id);
    if (!h.items) return '';
    return h.items.map(function (i) { return HP.tr(i.name); }).join(', ');
  }

  function unitLabel(u) {
    if (u && typeof u === 'object') return HP.tr(u);
    var map = { day: 'days', days: 'days', hari: 'days', min: 'min', minutes: 'min', minit: 'min', l: 'l', litre: 'l', litres: 'l', liter: 'l',
      h: 'h', hour: 'h', hours: 'h', jam: 'h', time: 'times', times: 'times', night: 'nights', nights: 'nights', item: 'items', items: 'items' };
    var k = map[String(u || 'days').toLowerCase()];
    return k ? t('plan.u.' + k) : String(u);
  }

  /** Weekly goal for a habit with a guard if scoring.weeklyGoal is missing. */
  function weeklyGoal(id, weekStart, ws) {
    try {
      if (HP.scoring && typeof HP.scoring.weeklyGoal === 'function') {
        var g = HP.scoring.weeklyGoal(id, weekStart);
        if (g && typeof g.goal === 'number') return { done: g.done || 0, goal: g.goal, unit: g.unit || 'days' };
      }
    } catch (e) { /* fall through */ }
    var hs = ws && ws.habits && ws.habits[id];
    return { done: hs ? hs.done : 0, goal: hs ? hs.scheduled : HP.store.getScheduledDays(id).length, unit: 'days' };
  }

  function meter(value, color, label) {
    if (HP.charts && HP.charts.meter) return HP.charts.meter({ value: HP.clamp(value, 0, 1), color: color, height: 8, label: label });
    return el('div', { class: 'plan-meter-fallback', role: 'progressbar', 'aria-label': label, 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': Math.round(value * 100) },
      el('span', { style: { width: Math.round(HP.clamp(value, 0, 1) * 100) + '%', background: color } }));
  }

  /* ---------- cell state ---------- */
  function cellState(day, hd) {
    if (!hd.scheduled) return (hd.done || hd.bonus) ? 'bonus' : 'rest';
    if (hd.done) return 'done';
    if (hd.progress > 0) return 'partial';
    if (day.isFuture || day.isToday) return 'upcoming';
    // Days before tracking began are neutral, never "missed" (same rule as Today and Progress).
    try {
      var sd = HP.scoring && HP.scoring.startDate && HP.scoring.startDate();
      if (sd && day.date < sd) return 'upcoming';
    } catch (e) { /* fall through */ }
    return 'missed';
  }

  function shortValue(habit, hd) {
    if (habit.kind === 'multi') return (Array.isArray(hd.value) ? hd.value.length : 0) + '/' + habit.items.length;
    if (habit.kind === 'amount') return num(Number(hd.value) || 0);
    return '';
  }

  function ringSvg(progress, color) {
    var r = 9, c = 2 * Math.PI * r;
    return el('svg', { class: 'plan-ring', viewBox: '0 0 24 24', width: 24, height: 24, 'aria-hidden': 'true' },
      el('circle', { cx: 12, cy: 12, r: r, fill: 'none', stroke: 'var(--border)', 'stroke-width': 3 }),
      el('circle', { cx: 12, cy: 12, r: r, fill: 'none', stroke: color, 'stroke-width': 3, 'stroke-linecap': 'round',
        'stroke-dasharray': (c * HP.clamp(progress, 0, 1)).toFixed(2) + ' ' + c.toFixed(2), transform: 'rotate(-90 12 12)' }));
  }

  function badge(kind, ic, size) {
    return el('span', { class: 'plan-badge plan-badge-' + kind, 'aria-hidden': 'true' }, icon(ic, size || 14, 'plan-badge-ic'));
  }

  function stateNodes(state, habit, hd) {
    switch (state) {
      case 'done': return [badge('done', 'check', 15)];
      case 'partial': return [ringSvg(hd.progress, habit.color), el('span', { class: 'plan-val num' }, shortValue(habit, hd))];
      case 'missed': return [badge('missed', 'x', 12)];
      case 'upcoming': return [el('span', { class: 'plan-badge plan-badge-upcoming', 'aria-hidden': 'true' })];
      case 'bonus': return [badge('bonus', 'star', 14), el('span', { class: 'plan-val' }, t('status.bonus'))];
      default: return [badge('rest', 'minus', 13), el('span', { class: 'plan-val' }, t('status.rest'))];
    }
  }

  function statusLabel(state) {
    return t('status.' + (state === 'missed' ? 'missed' : state));
  }

  /* ---------- sections ---------- */
  function buildNavigator(week, ws) {
    var cur = currentWeek();
    var isCurrent = week === cur;
    var prev = el('button', {
      type: 'button', class: 'btn btn-ghost btn-icon plan-nav-btn', 'aria-label': t('plan.prevWeek'), dataset: { fk: 'plan-prev' },
      onclick: function () { viewWeek = HP.dates.addDays(week, -7); rerender(); }
    }, icon('chevron-left', 22));
    var next = el('button', {
      type: 'button', class: 'btn btn-ghost btn-icon plan-nav-btn', 'aria-label': t('plan.nextWeek'), dataset: { fk: 'plan-next' },
      disabled: isCurrent,
      onclick: function () { viewWeek = HP.dates.addDays(week, 7); if (viewWeek > cur) viewWeek = cur; rerender(); }
    }, icon('chevron-right', 22));
    var mid = el('div', { class: 'plan-nav-mid', role: 'group', 'aria-label': t('plan.weekNav') },
      el('div', { class: 'plan-nav-label num', 'aria-live': 'polite' }, weekLabel(week)),
      el('div', { class: 'plan-nav-sub small muted' },
        isCurrent ? t('plan.thisWeek') + (ws.scheduledTotal > 0 ? ' · ' : '') : '',
        ws.scheduledTotal > 0 ? t('plan.weekDone', { done: ws.doneTotal, total: ws.scheduledTotal }) : ''));
    var nodes = [prev, mid, next];
    var card = el('div', { class: 'card plan-nav' }, nodes);
    if (!isCurrent) {
      card.appendChild(el('button', {
        type: 'button', class: 'btn btn-sm plan-nav-today', dataset: { fk: 'plan-this' },
        onclick: function () { viewWeek = cur; rerender(); }
      }, t('plan.thisWeek')));
    }
    return card;
  }

  function buildToolbar() {
    var kids = [
      el('button', {
        type: 'button', class: 'btn btn-sm ' + (editMode ? 'btn-primary' : 'btn-ghost'), 'aria-pressed': editMode ? 'true' : 'false', dataset: { fk: 'plan-edit' },
        onclick: function () { editMode = !editMode; rerender(); }
      }, icon(editMode ? 'check' : 'edit', 16), ' ', editMode ? t('plan.editing') : t('plan.edit'))
    ];
    return el('div', { class: 'plan-toolbar row row-between row-wrap' },
      el('h2', { class: 'h3 plan-focus' }, t('plan.focus')), kids);
  }

  function buildEditPanel() {
    return el('div', { class: 'card plan-editpanel stack-sm' },
      el('p', { class: 'small plan-edit-hint' }, t('plan.editHint')),
      el('p', { class: 'small plan-edit-note', role: 'note' }, icon('info', 14), ' ', t('plan.editNote')),
      el('button', {
        type: 'button', class: 'btn btn-sm btn-ghost btn-danger plan-reset', dataset: { fk: 'plan-reset' },
        onclick: function () {
          HP.ui.confirm({
            title: t('plan.resetTitle'), message: t('plan.resetMsg'),
            confirmLabel: t('plan.resetConfirm'), cancelLabel: t('common.cancel'), danger: true
          }).then(function (ok) {
            if (!ok) return;
            HP.store.resetPlan();
            if (HP.ui.toast) HP.ui.toast(t('plan.resetToast'), { type: 'success', icon: 'refresh' });
          });
        }
      }, icon('refresh', 16), ' ', t('plan.reset')));
  }

  function buildDayHead(ws) {
    var cells = ws.days.map(function (d, i) {
      var dn = HP.dates.parse(d.date).getDate();
      return el('div', { class: 'plan-dayhead' + (d.isToday ? ' plan-today' : ''), role: 'columnheader', 'aria-label': HP.config.dayName(i, 'full') + ' ' + dn },
        el('span', { class: 'plan-dayname' }, t('day.short.' + i)),
        el('span', { class: 'plan-daynum num' }, String(dn)));
    });
    return el('div', { class: 'plan-days plan-headrow', role: 'row' }, cells);
  }

  function buildCell(ws, i, habit) {
    var day = ws.days[i];
    var hd = day.habits.filter(function (x) { return x.id === habit.id; })[0] || { scheduled: false, progress: 0, done: false, value: null };
    var fk = 'plan-cell-' + habit.id + '-' + i;
    var dayFull = HP.config.dayName(i, 'full');
    var cls = 'plan-cell' + (day.isToday ? ' plan-today' : '');
    var attrs = { type: 'button', role: 'gridcell', dataset: { fk: fk, date: day.date } };

    if (editMode) {
      var on = HP.store.isScheduled(habit.id, day.date);
      var days = HP.store.getScheduledDays(habit.id);
      attrs.class = cls + ' plan-cell-edit plan-state-' + (on ? 'sched' : 'rest');
      attrs['aria-pressed'] = on ? 'true' : 'false';
      attrs['aria-label'] = HP.config.name(habit.id) + ', ' + dayFull + ': ' + (on ? t('plan.scheduled') : t('status.rest'));
      attrs.onclick = function () {
        var next = on ? days.filter(function (d) { return d !== i; }) : days.concat([i]);
        HP.store.setPlan(habit.id, { days: next.sort(function (a, b) { return a - b; }) });
      };
      return el('button', attrs, on
        ? [badge('sched', 'check', 14), el('span', { class: 'plan-val' }, t('plan.on'))]
        : [badge('rest', 'minus', 13), el('span', { class: 'plan-val' }, t('status.rest'))]);
    }

    var state = cellState(day, hd);
    attrs.class = cls + ' plan-state-' + state;
    var label = HP.config.name(habit.id) + ', ' + dayFull + ': ' + statusLabel(state);
    if (state === 'partial') label += ' (' + shortValue(habit, hd) + ')';
    attrs['aria-label'] = label + '. ' + t('plan.cellOpen', { day: dayFull });
    attrs.onclick = function () {
      HP.app.setDate(day.date);
      HP.app.navigate('today', { date: day.date });
    };
    return el('button', attrs, stateNodes(state, habit, hd));
  }

  function buildHabitRow(ws, habit) {
    var id = habit.id;
    var iconWrap = el('span', { class: 'plan-hicon', style: { '--hc': habit.color }, 'aria-hidden': 'true' }, icon(habit.icon, 20));
    var sub = itemsText(id);
    var head = el('div', { class: 'plan-habit-head' }, iconWrap,
      el('div', { class: 'plan-habit-text' },
        el('div', { class: 'plan-habit-name' }, HP.config.name(id)),
        el('div', { class: 'plan-habit-target small' }, targetText(id)),
        sub ? el('div', { class: 'plan-habit-sub small muted' }, sub) : null));

    var kids = [head];
    if (editMode) {
      var days = HP.store.getScheduledDays(id);
      if (!habit.fixedTarget && habit.targetRange) {
        var r = habit.targetRange;
        var unit = HP.tr(habit.unit);
        var st = HP.ui.stepper({
          value: HP.store.getTarget(id), min: r.min, max: r.max, step: r.step, unit: unit,
          format: function (v) { return num(v) + ' ' + unit; },
          label: t('plan.targetOf', { habit: HP.config.name(id) }),
          onChange: function (v) { HP.store.setPlan(id, { target: v }); }
        });
        st.dataset.fk = 'plan-step-' + id;
        kids.push(el('div', { class: 'plan-tools row row-between' }, el('span', { class: 'small muted' }, t('plan.target')), st));
      }
      if (!days.length) {
        kids.push(el('p', { class: 'plan-warn small', role: 'status', 'aria-live': 'polite' }, icon('info', 14), ' ', t('plan.zeroDays', { habit: HP.config.name(id) })));
      }
    }
    var cells = [];
    for (var i = 0; i < 7; i++) cells.push(buildCell(ws, i, habit));
    kids.push(el('div', { class: 'plan-days', role: 'row' }, cells));
    return el('div', { class: 'plan-habit' + (editMode ? ' plan-habit-editing' : ''), role: 'rowgroup', dataset: { habit: id } }, kids);
  }

  function buildLegend() {
    var items = [['done', 'status.done'], ['partial', 'status.partial'], ['missed', 'status.missed'], ['upcoming', 'status.upcoming'], ['rest', 'status.rest'], ['bonus', 'status.bonus']];
    return el('ul', { class: 'plan-legend small muted', 'aria-label': t('plan.legend') }, items.map(function (it) {
      var sample;
      if (it[0] === 'partial') sample = ringSvg(0.5, 'var(--brand)');
      else if (it[0] === 'upcoming') sample = el('span', { class: 'plan-badge plan-badge-upcoming' });
      else sample = badge(it[0], it[0] === 'done' ? 'check' : it[0] === 'missed' ? 'x' : it[0] === 'bonus' ? 'star' : 'minus', 12);
      return el('li', { class: 'plan-legend-item' }, el('span', { class: 'plan-legend-ic', 'aria-hidden': 'true' }, sample), el('span', null, t(it[1])));
    }));
  }

  function buildGrid(ws) {
    var rows = HP.config.HABITS.map(function (h) { return buildHabitRow(ws, h); });
    return el('div', { class: 'card plan-grid', role: 'grid', 'aria-label': t('plan.gridLabel') },
      buildDayHead(ws), rows, editMode ? null : buildLegend());
  }

  function buildSummary(week, ws) {
    var tiles = HP.config.HABITS.map(function (h) {
      var g = weeklyGoal(h.id, week, ws);
      var frac = g.goal > 0 ? g.done / g.goal : 0;
      var unit = unitLabel(g.unit);
      var xy = num(g.done) + ' / ' + num(g.goal);
      return el('div', { class: 'plan-tile', style: { '--hc': h.color }, role: 'group', 'aria-label': HP.config.name(h.id) },
        el('div', { class: 'plan-tile-head' },
          el('span', { class: 'plan-hicon plan-hicon-sm', 'aria-hidden': 'true' }, icon(h.icon, 16)),
          el('span', { class: 'plan-tile-name' }, HP.config.name(h.id))),
        el('div', { class: 'plan-tile-goal small muted' }, goalText(h.id)),
        meter(frac, h.color, HP.config.name(h.id) + ' ' + xy + ' ' + unit),
        el('div', { class: 'plan-tile-count num' }, el('strong', null, xy), ' ', el('span', { class: 'small muted' }, unit)));
    });
    return el('section', { class: 'plan-summary stack-sm', 'aria-label': t('plan.summary') },
      el('div', { class: 'plan-summary-head' },
        el('h2', { class: 'h3' }, icon('target', 18), ' ', t('plan.summary')),
        el('span', { class: 'small muted' }, t('plan.summaryNote'))),
      el('div', { class: 'plan-tiles' }, tiles));
  }

  function buildFooter() {
    var chips = [1, 2, 3, 4].map(function (n) { return HP.ui.chip(t('plan.goal' + n), { tone: 'brand' }); });
    return el('footer', { class: 'plan-footer card' },
      el('div', { class: 'plan-tagline h3' }, icon('heart', 18), ' ', t('app.tagline')),
      el('div', { class: 'plan-goals', role: 'list', 'aria-label': t('plan.goalsLabel') },
        chips.map(function (c) { c.setAttribute('role', 'listitem'); return c; })));
  }

  /* ---------- view ---------- */
  HP.views.plan = {
    id: 'plan',
    icon: 'calendar',
    titleKey: 'nav.plan',
    render: function (container) {
      lastContainer = container;
      var week = activeWeek();
      var ws = HP.scoring.weekScore(week);
      HP.mount(container, el('div', { class: 'page plan-page stack' },
        el('h1', { class: 'page-title plan-title' }, t('plan.title')),
        buildNavigator(week, ws),
        buildToolbar(),
        editMode ? buildEditPanel() : null,
        buildGrid(ws),
        buildSummary(week, ws),
        buildFooter()));
    }
  };
})();

</script>

    },
    en: {

      'rewards.xpOf': '{a} / {b} XP',
      'rewards.xpToNext': '{n} XP to {name}',
      'rewards.maxLevel': 'You are at the top level. Well done!',
      'rewards.totalXp': 'Total XP',
      'rewards.streakTitle': 'Streak',
      'rewards.streakDays': 'days in a row',
      'rewards.streakNone': 'No streak yet',
      'rewards.bestStreak': 'Best: {n} days',
      'rewards.streakRule': "A day counts when you hit {pct}% of the day's plan. Rest days never break your streak.",
      'rewards.streakRisk': "Hit {pct}% of today's plan to keep your {n}-day streak alive.",
      'rewards.streakStart': "Hit {pct}% of today's plan to start a new streak.",
      'rewards.xpToday': 'XP today',
      'rewards.xpWeek': 'XP this week',
      'rewards.howTitle': 'How to earn XP',
      'rewards.howHabit': '+{n} XP for every habit you finish on a planned day',
      'rewards.howPerfect': '+{n} XP bonus for a perfect day',
      'rewards.howRest': '+{n} XP bonus when you finish a habit on a rest day',
      'rewards.howStreak': 'Up to +{n} XP streak bonus on perfect days (+{per} for each streak day)',
      'rewards.ratingTitle': 'Commitment Rating',
      'rewards.noRating': 'Not enough data yet',
      'rewards.thisWeek': 'This week',
      'rewards.last30': 'Last 30 days',
      'rewards.grade': 'Grade {g}',
      'rewards.badgesTitle': 'Badge collection',
      'rewards.badgeCount': '{n} / {total} badges',
      'rewards.locked': 'Locked',
      'rewards.unlockedOn': 'Earned {date}',
      'rewards.unlocked': 'Earned',
      'rewards.new': 'New',
      'rewards.howToEarn': 'How to earn it',
      'rewards.progress': 'Progress',
      'rewards.nextTitle': 'Almost there',
      'rewards.toGo': '{pct}% to go',
      'rewards.roadmapTitle': 'Levels roadmap',
      'rewards.roadmapAria': 'List of levels',
      'rewards.xpNeeded': '{n} XP',
      'rewards.current': 'Current',
      'rewards.reached': 'Reached',
      'rewards.unavailable': 'Rewards are not ready yet. Try reloading the page.'
    }
  });

  /* ---------- module state (survives re-renders) ---------- */
  var lastXp = null;      // last XP total shown; null until first paint
  var xpHelpOpen = false; // keep the <details> open across re-renders

  /* ---------- small guarded helpers ---------- */
  function num(n, fallback) { n = Number(n); return isFinite(n) ? n : (fallback || 0); }
  function clamp01(n) { return HP.clamp(num(n, 0), 0, 1); }
  function t(key, params) { return HP.t(key, params); }

  function icon(name, size) {
    try {
      if (HP.icons && HP.icons.svg) return HP.icons.svg(name, { size: size || 20 });
    } catch (e) { /* fall through */ }
    return h('span', { 'aria-hidden': 'true' });
  }

  function meter(value, color, label, height) {
    value = clamp01(value);
    try {
      if (HP.charts && HP.charts.meter) return HP.charts.meter({ value: value, color: color, height: height || 8, label: label });
    } catch (e) { /* fall through */ }
    return h('div', { class: 'rewards-fallback-meter', role: 'progressbar', 'aria-label': label || '', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(Math.round(value * 100)) },
      h('div', { class: 'rewards-fallback-fill', style: { width: Math.round(value * 100) + '%', background: color || 'var(--brand)' } }));
  }

  function stars(value) {
    try {
      if (HP.charts && HP.charts.stars) return HP.charts.stars(num(value), { size: 20 });
    } catch (e) { /* fall through */ }
    return h('span', { class: 'rewards-stars-fallback' }, num(value) + ' / 5');
  }

  function dateLabel(d) {
    try { return HP.dates.label(d, { style: 'short' }); } catch (e) { return d || ''; }
  }

  function today() {
    try { return HP.dates.today(); } catch (e) { return null; }
  }

  function safe(fn, fallback) {
    try { var r = fn(); return r == null ? fallback : r; } catch (e) { return fallback; }
  }

  /* ---------- sections ---------- */
  function levelCard(g) {
    var need = num(g.levelNeed, 0);
    var inLevel = num(g.levelXp, 0);
    var pct = need > 0 ? clamp01(inLevel / need) : clamp01(g.levelPct);
    var isMax = !g.nextLevelName || need <= 0;
    var totalEl = h('span', { class: 'rewards-total-xp num' }, num(g.xp, 0) + ' XP');

    var from = lastXp == null ? 0 : lastXp;
    var to = num(g.xp, 0);
    var reduce = false;
    try { reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* ignore */ }
    if (from !== to && !reduce && HP.ui && HP.ui.animateNumber) {
      try { HP.ui.animateNumber(totalEl, to, { from: from, ms: 700, dp: 0, suffix: ' XP' }); } catch (e) { /* keep static text */ }
    }
    lastXp = to;

    return h('section', { class: 'rewards-hero', 'aria-label': t('rewards.level', { n: g.level }) },
      h('div', { class: 'rewards-hero-top' },
        h('div', { class: 'rewards-level-emoji', 'aria-hidden': 'true' }, g.levelEmoji || '🌱'),
        h('div', { class: 'rewards-hero-text' },
          h('div', { class: 'rewards-level-num' }, t('rewards.level', { n: g.level })),
          h('h2', { class: 'rewards-level-name' }, HP.tr(g.levelName)))),
      h('div', { class: 'rewards-hero-xp' },
        h('div', { class: 'rewards-meter' }, meter(isMax ? 1 : pct, 'var(--brand)', t('rewards.xpOf', { a: inLevel, b: need }), 12)),
        h('div', { class: 'rewards-xp-line row row-between' },
          h('span', { class: 'num' }, isMax ? t('rewards.maxLevel') : t('rewards.xpOf', { a: inLevel, b: need })),
          isMax ? null : h('span', { class: 'rewards-xp-next' }, t('rewards.xpToNext', { n: Math.max(0, need - inLevel), name: HP.tr(g.nextLevelName) })))),
      h('div', { class: 'rewards-total row row-between' },
        h('span', { class: 'rewards-total-label' }, t('rewards.totalXp')),
        totalEl));
  }

  function streakCard(g) {
    var streak = g.streak || {};
    var cur = num(streak.current, 0);
    var best = num(streak.best, 0);
    var minPct = num(HP.config.STREAK_MIN_PCT, 70);
    var td = today();
    var ds = td ? safe(function () { return HP.scoring.dayScore(td); }, null) : null;
    var qualified = ds ? (ds.isRest || num(ds.pct) >= minPct) : true;
    var showHint = ds && !qualified;
    var hint = null;
    if (showHint) {
      hint = h('div', { class: 'rewards-risk', role: 'note' },
        icon('info', 20),

  function xpTiles(g) {
    var X = HP.config.XP || {};
    var tile = function (label, value, key) {

        h('div', { class: 'rewards-tile-label small muted' }, label),
        h('div', { class: 'rewards-tile-value num' }, '+' + num(value, 0), h('span', { class: 'rewards-tile-unit' }, ' XP')));

    var details = h('details', { class: 'card rewards-how', open: xpHelpOpen ? true : null },
      h('summary', { class: 'rewards-how-summary', 'data-fk': 'rewards-xp-help' },
        h('span', null, t('rewards.howTitle')),
        icon('chevron-down', 20)),
      h('ul', { class: 'rewards-how-list' },
        h('li', null, t('rewards.howHabit', { n: num(X.perHabit) })),
        h('li', null, t('rewards.howPerfect', { n: num(X.perfectDayBonus) })),
        h('li', null, t('rewards.howRest', { n: num(X.bonusOnRestDay) })),
        h('li', null, t('rewards.howStreak', { n: num(X.streakBonusCap), per: num(X.streakBonusPerDay) }))));
    details.addEventListener('toggle', function () { xpHelpOpen = details.open; });

      h('div', { class: 'grid-2 rewards-tiles' }, tile(t('rewards.xpToday'), g.todayXp, 'today'), tile(t('rewards.xpWeek'), g.weekXp, 'week')),

  function ratingCol(label, rating, pct, hasData) {
    if (hasData === false) { // brand-new user: no grade yet, so nothing can look like a failure
      return h('div', { class: 'rewards-rate-col' },
        h('div', { class: 'rewards-rate-label small muted' }, label),
        h('div', { class: 'rewards-rate-main' },
          h('div', { class: 'rewards-grade', style: { '--grade': 'var(--border)' }, 'aria-hidden': 'true' }, h('span', { 'aria-hidden': 'true' }, '-')),

    }
    rating = rating || { stars: 0, grade: 'D', key: 'restart', color: '#9AA0A6' };
    return h('div', { class: 'rewards-rate-col' },
      h('div', { class: 'rewards-rate-label small muted' }, label),
      h('div', { class: 'rewards-rate-main' },
        h('div', { class: 'rewards-grade', style: { '--grade': rating.color || '#9AA0A6' }, role: 'img', 'aria-label': t('rewards.grade', { g: rating.grade }) },

        h('div', { class: 'rewards-rate-info' },
          stars(rating.stars),
          h('div', { class: 'rewards-rate-text' },

            pct != null ? h('span', { class: 'muted num' }, ' ' + Math.round(num(pct)) + '%') : null))));
  }

  function ratingCard() {
    var td = today();
    var wk = td ? safe(function () { return HP.scoring.weekScore(td); }, null) : null;
    var mo = td ? safe(function () { return HP.scoring.commitment(30); }, null) : null;
    return h('section', { class: 'card rewards-rating' },
      h('h3', { class: 'card-title' }, t('rewards.ratingTitle')),
      h('div', { class: 'rewards-rate-grid' },
        ratingCol(t('rewards.thisWeek'), wk && wk.rating, wk ? wk.pct : null, !!(wk && wk.scheduledTotal > 0 && wk.daysElapsed > 0)),
        ratingCol(t('rewards.last30'), mo && mo.rating, mo ? mo.pct : null, !!(mo && mo.scheduledTotal > 0))));
  }

  function isNewBadge(b) {
    var td = today();
    if (!b.unlocked || !b.unlockedOn || !td) return false;
    var d = safe(function () { return HP.dates.diffDays(b.unlockedOn, td); }, 99);
    return d >= 0 && d <= 2;
  }

  function sortBadges(list) {
    var unlocked = list.filter(function (b) { return b.unlocked; }).sort(function (a, b) {
      return String(b.unlockedOn || '').localeCompare(String(a.unlockedOn || ''));
    });
    var locked = list.filter(function (b) { return !b.unlocked; }).sort(function (a, b) {
      return num(b.progress) - num(a.progress);
    });
    return unlocked.concat(locked);
  }

  function badgeCard(b) {
    var locked = !b.unlocked;
    var isNew = isNewBadge(b);
    var name = HP.tr(b.name);
    var cls = 'rewards-badge ' + (locked ? 'is-locked' : 'is-unlocked') + (isNew ? ' is-new' : '');
    var aria = name + '. ' + (locked ? t('rewards.locked') : t('rewards.unlocked'));
    var visual = h('div', { class: 'rewards-badge-art' },
      h('span', { class: 'rewards-badge-emoji', 'aria-hidden': 'true' }, b.emoji || '🏅'),
      locked ? h('span', { class: 'rewards-lock', 'aria-hidden': 'true' }, icon('lock', 14)) : null,
      isNew ? h('span', { class: 'pill rewards-new-pill' }, t('rewards.new')) : null);
    var foot = locked
      ? [
        h('div', { class: 'rewards-badge-state small' }, icon('lock', 14), h('span', null, t('rewards.locked'))),
        meter(b.progress, 'var(--brand)', name + ' ' + t('rewards.progress'), 6),
        h('div', { class: 'rewards-badge-hint small muted' }, HP.tr(b.hint))
      ]
      : [h('div', { class: 'rewards-badge-state small' }, icon('check-circle', 14),
        h('span', null, b.unlockedOn ? t('rewards.unlockedOn', { date: dateLabel(b.unlockedOn) }) : t('rewards.unlocked')))];
    return h('button', {
      type: 'button', class: cls, 'aria-label': aria, 'data-fk': 'rewards-badge-' + b.id,
      onclick: function () { openBadge(b); }
    }, visual, h('div', { class: 'rewards-badge-name' }, name), h('div', { class: 'rewards-badge-desc small muted' }, HP.tr(b.desc)), foot);
  }

  function openBadge(b) {
    var locked = !b.unlocked;
    var pct = Math.round(clamp01(b.progress) * 100);
    var body = h('div', { class: 'rewards-sheet' },
      h('div', { class: 'rewards-sheet-art' + (locked ? ' is-locked' : '') },
        h('span', { class: 'rewards-sheet-emoji', 'aria-hidden': 'true' }, b.emoji || '🏅'),
        locked ? h('span', { class: 'rewards-lock rewards-lock-lg', 'aria-hidden': 'true' }, icon('lock', 20)) : null),

        h('div', { class: 'rewards-sheet-h small muted' }, t('rewards.howToEarn')),

    var sorted = sortBadges(badges);

  function levelXpNeeded(l) {
    var keys = ['xp', 'minXp', 'xpRequired', 'xpNeeded', 'min', 'at', 'threshold', 'need', 'from'];
    for (var i = 0; i < keys.length; i++) if (l && typeof l[keys[i]] === 'number') return l[keys[i]];
    return null;
  }

  function roadmap(g) {
    var levels = (HP.gamify && HP.gamify.levels) || [];
    if (!levels.length) return null;
    var items = levels.map(function (l, i) {
      var n = num(l.level != null ? l.level : (l.n != null ? l.n : i + 1), i + 1);
      var state = n === g.level ? 'current' : (n < g.level ? 'past' : 'future');
      var xp = levelXpNeeded(l);
      return h('li', { class: 'rewards-lvl is-' + state, 'aria-current': state === 'current' ? 'step' : null, 'data-current': state === 'current' ? '1' : null },

    var scroller = h('ol', { class: 'rewards-roadmap-scroll', tabindex: '0', 'aria-label': t('rewards.roadmapAria'), 'data-fk': 'rewards-roadmap' }, items);
    var cur = items.filter(function (li) { return li.getAttribute('data-current') === '1'; })[0];
    if (cur) {
      var center = function () {
        if (!scroller.isConnected) return;
        scroller.scrollLeft = Math.max(0, cur.offsetLeft - (scroller.clientWidth - cur.offsetWidth) / 2);
      };
      if (window.requestAnimationFrame) window.requestAnimationFrame(center); else setTimeout(center, 0);
    }
    return h('section', { class: 'rewards-roadmap' },
      h('h3', { class: 'h3 rewards-roadmap-title' }, t('rewards.roadmapTitle')),
      scroller);
  }

  /* ---------- render ---------- */
  function render(container) {
    var g = null;
    try { g = HP.gamify.compute(); } catch (e) { console.error('[rewards] gamify.compute failed', e); }
    if (!g) {
      HP.mount(container, h('div', { class: 'page rewards-page' },
        h('h1', { class: 'page-title' }, t('nav.rewards')),
        HP.ui && HP.ui.emptyState
          ? HP.ui.emptyState({ icon: 'trophy', title: t('nav.rewards'), body: t('rewards.unavailable') })
          : h('p', { class: 'muted' }, t('rewards.unavailable'))));
      return;
    }
    var badges = Array.isArray(g.badges) ? g.badges : [];
    HP.mount(container, h('div', { class: 'page rewards-page stack' },
      h('h1', { class: 'page-title' }, t('nav.rewards')),
      levelCard(g),
      streakCard(g),
      xpTiles(g),
      ratingCard(),
      nextUp(badges),
      badgeGrid(badges),
      roadmap(g)));
  }

  HP.views.rewards = { id: 'rewards', icon: 'trophy', titleKey: 'nav.rewards', render: render };
})();
